<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Navigating AI Risk — Evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#ffffff; --ink:#111113; --ink-60:#5c5c61; --ink-45:#84848a; --ink-30:#a8a8ae; --ink-20:#c7c7cc;
    --hair:#e7e7ea; --hair-2:#f1f1f3; --fill:#f4f4f6; --fill-2:#ececef;
    --serif:"Newsreader", Georgia, "Times New Roman", serif;
    --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--serif); font-size:16px; line-height:1.45; display:flex; flex-direction:column; overflow:hidden; }
  a { color:inherit; text-decoration:none; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#e0e0e3; border-radius:6px; border:3px solid #fff; }
  ::-webkit-scrollbar-thumb:hover { background:#cfcfd3; }

  /* top bar */
  .bar { flex:none; height:54px; display:flex; align-items:center; gap:24px; padding:0 26px; border-bottom:1px solid var(--hair); }
  .bar__brand { display:flex; align-items:baseline; gap:11px; white-space:nowrap; }
  .bar__brand b { font-weight:500; font-size:16px; letter-spacing:-0.015em; }
  .bar__brand span { font-family:var(--sans); font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-45); }
  .search { flex:1; max-width:520px; position:relative; }
  .search input { width:100%; font-family:var(--sans); font-size:13.5px; color:var(--ink); background:var(--fill); border:1px solid transparent; border-radius:10px; padding:9px 14px 9px 34px; outline:none; transition:background .2s, border-color .2s; }
  .search input:focus { background:#fff; border-color:#dcdce0; }
  .search input::placeholder { color:var(--ink-30); }
  .search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:14px; height:14px; stroke:var(--ink-30); fill:none; stroke-width:1.8; }
  .bar__meta { margin-left:auto; font-family:var(--sans); font-size:11px; color:var(--ink-45); text-align:right; line-height:1.5; white-space:nowrap; }
  .bar__meta b { color:var(--ink); font-weight:600; }
  .views { display:flex; gap:2px; font-family:var(--sans); }
  .views a { font-size:11.5px; color:var(--ink-45); padding:5px 11px; border-radius:7px; transition:color .2s, background .2s; }
  .views a:hover { color:var(--ink); background:var(--fill); }
  .views a.on { color:var(--ink); background:var(--fill-2); }
  @media (max-width:820px){ .bar__meta{ display:none; } }

  /* layout */
  .cols { flex:1; display:grid; grid-template-columns:300px 1fr; min-height:0; }
  .pane { min-height:0; display:flex; flex-direction:column; border-right:1px solid var(--hair); }
  .pane:last-child { border-right:none; }
  .pane__head { flex:none; display:flex; align-items:center; justify-content:space-between; gap:10px; height:42px; padding:0 18px 0 22px; border-bottom:1px solid var(--hair-2); }
  .pane__label { font-family:var(--sans); font-size:10.5px; letter-spacing:0.13em; text-transform:uppercase; color:var(--ink-45); }
  .pane__body { flex:1; overflow-y:auto; padding:8px 12px 40px; }

  /* category rows */
  .row { width:100%; text-align:left; background:none; border:none; cursor:pointer; font-family:var(--serif); display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:9px 12px; border-radius:9px; transition:background .15s; }
  .row:hover { background:var(--fill); }
  .row.is-active { background:var(--fill-2); }
  .row__name { font-size:15.5px; letter-spacing:-0.01em; line-height:1.25; color:var(--ink); }
  .row__n { font-family:var(--sans); font-size:11px; font-variant-numeric:tabular-nums; color:var(--ink-30); flex:none; padding-top:2px; }
  .row.is-active .row__n { color:var(--ink-60); }

  /* evidence main */
  .ev { padding:6px 40px 80px; max-width:820px; }
  .crumb { font-family:var(--sans); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-45); display:flex; gap:8px; align-items:center; min-width:0; }
  .crumb b { color:var(--ink); font-weight:600; }
  .ev__title { font-size:30px; font-weight:400; letter-spacing:-0.02em; margin:24px 0 0; }
  .ev__overview { font-size:18px; line-height:1.5; color:var(--ink-60); font-weight:300; margin:11px 0 0; max-width:64ch; }
  .ev__count { font-family:var(--sans); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-45); margin:22px 0 0; padding-bottom:6px; border-bottom:1px solid var(--hair); }

  .point { padding:24px 0; border-top:1px solid var(--hair); position:relative; }
  .point__score { position:absolute; top:25px; right:0; font-family:var(--sans); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-30); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .point__score b { color:var(--ink-60); font-weight:600; font-size:12.5px; }
  .point:first-of-type { border-top:none; }
  .point__cat { font-family:var(--sans); font-size:9.5px; font-weight:600; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-45); margin-bottom:8px; }
  .point__text { font-size:18.5px; line-height:1.5; letter-spacing:-0.01em; color:var(--ink); margin:0; padding-right:64px; }
  .sources { margin:13px 0 0; padding-left:15px; border-left:2px solid var(--hair); }
  .sources__label { font-family:var(--sans); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-45); margin-bottom:6px; }
  .sources__list { display:flex; flex-direction:column; gap:5px; }
  .src { font-size:14.5px; line-height:1.4; color:var(--ink-60); display:inline; }
  .src a { background-image:linear-gradient(var(--ink),var(--ink)); background-size:0% 1px; background-repeat:no-repeat; background-position:0 1.08em; transition:background-size .35s cubic-bezier(.2,.6,.2,1); color:var(--ink); }
  .src a:hover { background-size:100% 1px; }
  .src .yr { font-family:var(--sans); font-size:12px; color:var(--ink-30); }
  .src .ext { font-family:var(--sans); font-size:11px; color:var(--ink-30); margin-left:4px; }

  mark { background:#fbe7c0; color:inherit; border-radius:2px; padding:0 1px; }

  .empty { padding:60px 40px; color:var(--ink-30); font-style:italic; font-size:17px; }

  .m-back { display:none; }
  .head-l { display:flex; align-items:center; gap:9px; min-width:0; }
  @media (max-width:860px){
    .bar { height:auto; flex-wrap:wrap; padding:9px 16px; gap:9px 14px; }
    .bar__brand { order:1; }
    .views { order:2; margin-left:auto; }
    .search { order:3; flex-basis:100%; max-width:none; }
    .cols { display:block; position:relative; }
    .pane { position:absolute; inset:0; background:var(--paper); border-right:none; display:none; }
    .cols[data-step="0"] .pane:nth-child(1),
    .cols[data-step="1"] .pane:nth-child(2) { display:flex; }
    .m-back { display:inline-flex; align-items:center; justify-content:center; height:30px; padding:0 11px; border:1px solid var(--hair); background:var(--fill); border-radius:8px; font-family:var(--sans); font-size:14px; line-height:1; color:var(--ink-60); cursor:pointer; }
    .m-back:active { background:var(--fill-2); }
    .pane__body { padding:8px 16px 70px; }
    .ev { padding:6px 4px 70px; max-width:none; }
    .row { padding:13px 12px; }
    .row__name { font-size:16.5px; }
    .ev__title { font-size:25px; }
  }
</style>
</head>
<body>
  <header class="bar">
    <a class="bar__brand" href="home.html"><b>Navigating AI Risk</b><span>Evidence</span></a>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input id="q" type="text" placeholder="Search findings and cited papers…" autocomplete="off" />
    </div>
    <nav class="views">
      <a href="explorer.html">Explorer</a>
      <a href="coverage.html">Coverage</a>
      <a href="evidence.html" class="on">Evidence</a>
      <a href="graph.html">3D Graph</a>
      <a href="landscape.html">Landscape</a>
      <a href="mindmap.html">Mind Map</a>
    </nav>
    <div class="bar__meta" id="meta"></div>
  </header>

  <div class="cols" id="cols" data-step="0">
    <section class="pane">
      <div class="pane__head"><span class="pane__label">Categories</span><span class="pane__label" id="catCount"></span></div>
      <div class="pane__body" id="catList"></div>
    </section>
    <section class="pane">
      <div class="pane__head"><div class="head-l"><button class="m-back" data-to="0" aria-label="Back to categories">‹</button><div class="crumb" id="crumb"></div></div></div>
      <div class="pane__body"><div class="ev" id="ev"></div></div>
    </section>
  </div>

  <script src="risk_data.js"></script>
  <script src="syntheses.js"></script>
  <script>
    const S = window.SYNTHESES || {};
    const cats = (S.categories || []).filter(c => c.status === "ok" && c.points && c.points.length > 0);
    let activeCat = 0, query = "";

    // Findings carry no score of their own; pull each cited paper's score from the
    // Explorer dataset (risk_data.js) by matching titles, then score a finding by its
    // strongest supporting paper and sort findings (and search results) by that, desc.
    const _norm = t => (t||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
    const _scoreByTitle = new Map(); const _pubByTitle = new Map();
    (window.RISK && window.RISK.categories || []).forEach(c => c.subs.forEach(s => s.papers.forEach(p => {
      const k = _norm(p.title); if (!_scoreByTitle.has(k)) _scoreByTitle.set(k, p.score); if (!_pubByTitle.has(k)) _pubByTitle.set(k, p.published || p.year);
    })));
    function pointScore(pt){
      let best = null;
      (pt.papers||[]).forEach(pp => { const v = _scoreByTitle.get(_norm(pp.title)); if (v!=null && (best===null || v>best)) best = v; });
      return best;
    }
    cats.forEach(c => {
      c.points.forEach(pt => pt._score = pointScore(pt));
      c.points = c.points
        .map((pt,i)=>({pt,i}))
        .sort((a,b)=> ((b.pt._score==null?-1:b.pt._score) - (a.pt._score==null?-1:a.pt._score)) || (a.i-b.i))
        .map(x=>x.pt);
    });
    const scoreTag = pt => pt._score!=null ? `<div class="point__score">Score <b>${pt._score.toFixed(1)}</b></div>` : "";

    const elMeta = document.getElementById("meta");
    const elCat = document.getElementById("catList");
    const elEv = document.getElementById("ev");
    const elCrumb = document.getElementById("crumb");
    const elCatCount = document.getElementById("catCount");
    const cols = document.getElementById("cols");
    const setStep = n => cols.setAttribute("data-step", n);
    document.querySelectorAll(".m-back").forEach(b=>b.addEventListener("click", ()=>setStep(+b.dataset.to)));

    const totalPoints = cats.reduce((a,c)=>a+c.points.length,0);
    elMeta.innerHTML = `<b>${totalPoints}</b> findings · <b>${cats.length}</b> categories`
      + (S.generated ? `<br>generated ${S.generated}${S.model?` · ${S.model}`:""}` : "");
    elCatCount.textContent = cats.length;

    const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    function hl(text, q){
      const safe = esc(text);
      if (!q) return safe;
      const rx = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "ig");
      return safe.replace(rx, "<mark>$1</mark>");
    }

    function pointMatches(p, q){
      if (p.point.toLowerCase().includes(q)) return true;
      return (p.papers||[]).some(pp => (pp.title||"").toLowerCase().includes(q));
    }

    function renderCats(){
      const q = query.trim().toLowerCase();
      elCat.innerHTML = cats.map((c,i)=>{
        const n = q ? c.points.filter(p=>pointMatches(p,q)).length : c.points.length;
        const active = !q && i===activeCat;
        return `<button class="row ${active?'is-active':''}" data-i="${i}">
          <span class="row__name">${esc(c.name)}</span>
          <span class="row__n">${q ? n+"/"+c.points.length : c.nPapers}</span>
        </button>`;
      }).join("");
      elCat.querySelectorAll(".row").forEach(b=>b.onclick=()=>{
        activeCat=+b.dataset.i; query=""; document.getElementById("q").value="";
        renderCats(); renderEv(); setStep(1);
      });
    }

    function sourcesHTML(papers, q){
      if (!papers || !papers.length) return "";
      const items = papers.map(pp=>{
        const label = `${hl(pp.title, q)} <span class="yr">(${esc(_pubByTitle.get(_norm(pp.title)) || pp.year)})</span>`;
        return pp.url
          ? `<span class="src"><a href="${esc(pp.url)}" target="_blank" rel="noopener">${label}<span class="ext">↗</span></a></span>`
          : `<span class="src">${label}</span>`;
      }).join("");
      return `<div class="sources"><div class="sources__label">Sources</div><div class="sources__list">${items}</div></div>`;
    }

    function renderEv(){
      const q = query.trim().toLowerCase();
      const qraw = query.trim();

      if (q){
        // search mode — matching points across all categories, sorted by score desc
        const matches = [];
        cats.forEach(c => c.points.forEach(p => { if (pointMatches(p,q)) matches.push({c, p}); }));
        matches.sort((a,b)=> (b.p._score==null?-1:b.p._score) - (a.p._score==null?-1:a.p._score));
        elCrumb.innerHTML = `<b>Search</b><span>·</span>${matches.length} finding${matches.length===1?"":"s"} for “${esc(qraw)}”`;
        if (!matches.length){ elEv.innerHTML = `<div class="empty">No findings match “${esc(qraw)}”.</div>`; return; }
        elEv.innerHTML = `
          <h2 class="ev__title">Results</h2>
          <p class="ev__overview">Findings matching “${esc(qraw)}” across all categories, by score.</p>
          <div class="ev__count">${matches.length} finding${matches.length===1?"":"s"}</div>
          ${matches.map(({c,p})=>`
            <article class="point">
              ${scoreTag(p)}
              <div class="point__cat">${esc(c.name)}</div>
              <p class="point__text">${hl(p.point, qraw)}</p>
              ${sourcesHTML(p.papers, qraw)}
            </article>`).join("")}`;
        document.querySelector(".pane:last-child .pane__body").scrollTop = 0;
        return;
      }

      const c = cats[activeCat];
      elCrumb.innerHTML = `<b>${esc(c.name)}</b>`;
      elEv.innerHTML = `
        <h2 class="ev__title">${esc(c.name)}</h2>
        <p class="ev__overview">${esc(c.overview)}</p>
        <div class="ev__count">${c.points.length} finding${c.points.length===1?"":"s"} · ${c.nPapers} papers</div>
        ${c.points.map(p=>`
          <article class="point">
            ${scoreTag(p)}
            <p class="point__text">${esc(p.point)}</p>
            ${sourcesHTML(p.papers, "")}
          </article>`).join("")}`;
      document.querySelector(".pane:last-child .pane__body").scrollTop = 0;
    }

    document.getElementById("q").addEventListener("input", e=>{
      query = e.target.value;
      renderCats(); renderEv();
      if (query.trim()) setStep(1);
    });

    if (!cats.length){
      elEv.innerHTML = `<div class="empty">No evidence available.</div>`;
    } else {
      renderCats(); renderEv();
    }
  </script>
</body>
</html>
