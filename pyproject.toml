[project]
name = "ai-risk-retrieval"
version = "0.1.0"
description = "Intelligent retrieval of AI risk research papers across a structured taxonomy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marta Iwaszuk" }]

dependencies = [
    "httpx>=0.27",          # async HTTP, with timeouts and retries
    "pydantic>=2.6",        # strict schema validation for LLM output and config
    "pyyaml>=6.0",          # config loading
    "tenacity>=8.2",        # retry policy for network calls
    "feedparser>=6.0",      # arXiv Atom feed parsing
    "rapidfuzz>=3.6",       # title-based dedup
    "structlog>=24.1",      # structured, auditable logging
    "ollama>=0.3",          # local LLM client
    "typer>=0.12",          # CLI
    "rich>=13.7",           # CLI UX
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",          # httpx mocking
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
ai-risk-retrieval = "ai_risk_retrieval.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # asserts in tests are fine

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
