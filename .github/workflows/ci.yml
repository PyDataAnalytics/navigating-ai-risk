name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Taxonomy drift + adjacency integrity runs first and on its own.
      # If this fails, the build is dead — no point running the rest.
      - name: Validate taxonomy and adjacencies (drift guard)
        run: pytest tests/test_adjacencies.py -v

      # Layer 1 quality audits — content-quality checks complementing the
      # structural validator above.
      - name: Quality audits
        run: pytest tests/test_quality_audits.py -v

      - name: Run full test suite
        run: pytest -v

      - name: Lint
        run: ruff check src tests
