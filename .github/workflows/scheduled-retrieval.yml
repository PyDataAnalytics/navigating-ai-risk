name: scheduled-retrieval

on:
  schedule:
    # Every Monday at 03:00 UTC. Edit to taste.
    - cron: "0 3 * * 1"
  workflow_dispatch:    # Allow manual runs from the Actions tab

permissions:
  contents: write       # Needed to commit results back

concurrency:
  group: retrieval
  cancel-in-progress: false

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 3-hour ceiling; tune to your taxonomy size

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Start Ollama in the background
          ollama serve &
          # Wait for it to be ready
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama ready"
              break
            fi
            sleep 1
          done

      - name: Pull judge and screen models
        # llama3.1:8b is the detailed judge; llama3.2:3b is the cheap stage-1
        # binary screener (see config/ci.yaml). If runner RAM is tight, drop
        # the judge to a smaller model and update config/ci.yaml accordingly.
        run: |
          ollama pull llama3.1:8b
          ollama pull llama3.2:3b

      - name: Validate config
        run: ai-risk-retrieval validate-config -c config/ci.yaml -t config/taxonomy.yaml

      - name: Run retrieval
        env:
          # Optional: lift S2 rate limit
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          # Optional: enables the Google Scholar source
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          # Optional but strongly recommended: enters OpenAlex polite pool
          # (much higher rate limit). Any contact email is fine.
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: ai-risk-retrieval run --all -c config/ci.yaml -t config/taxonomy.yaml

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output/latest.json data/output/results-*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): scheduled retrieval $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Upload as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-results
          path: data/output/
          retention-days: 30
