name: discovery

# NEW-paper discovery on your own GPU. Creates a FRESH RunPod pod, runs the real
# Ollama pipeline ON the pod (keeping the "no third-party LLM" posture), pulls the
# run back, folds it into the corpus, commits, and ALWAYS terminates the pod.
#
# Runs WEEKLY (Sunday 04:00 UTC) and on manual dispatch. The create step is
# built to actually land a GPU: it validates GPU names against RunPod's live
# catalog (so a typo can't break it), auto-includes every >=24GB GPU, and tries
# SECURE then COMMUNITY cloud. In the rare event no GPU is available anywhere,
# the run SKIPS cleanly (green) instead of erroring - so a capacity blip never
# reddens the repo. Real bugs (bad API key, bad request) still fail loudly.
#
# Required repo secrets:  RUNPOD_API_KEY, RUNPOD_SSH_KEY (base64 private key)
# Optional (forwarded to the pod): SEMANTIC_SCHOLAR_API_KEY, OPENALEX_MAILTO,
#                                  UNPAYWALL_EMAIL, SERPAPI_API_KEY

on:
  schedule:
    - cron: "0 4 * * 0"   # 04:00 UTC every Sunday (refresh runs Monday - no clash)
  workflow_dispatch:
    inputs:
      gpu_types:
        description: "Comma-separated RunPod GPU type ids to try (any order)"
        default: "NVIDIA GeForce RTX 4090,NVIDIA RTX A5000,NVIDIA A40,NVIDIA L40S,NVIDIA GeForce RTX 3090"
      template_id:
        description: "RunPod template id to create from (recommended; overrides image)"
        default: ""
      image:
        description: "Container image (used only if template_id is blank)"
        default: "runpod/pytorch:2.1.0-py3.10-cuda11.8.0-devel-ubuntu22.04"
      config:
        description: "Pipeline config on the pod"
        default: "config/ci.yaml"

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

env:
  REMOTE_WORKDIR: /workspace/ai-risk-retrieval-work/navigating-ai-risk

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write SSH keypair
        env:
          RUNPOD_SSH_KEY_B64: ${{ secrets.RUNPOD_SSH_KEY }}
        run: |
          if [ -z "$RUNPOD_SSH_KEY_B64" ]; then
            echo "RUNPOD_SSH_KEY secret is not set" >&2; exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # base64-encoded so Windows/PowerShell encoding quirks can't corrupt it.
          printf '%s' "$RUNPOD_SSH_KEY_B64" | base64 -d > ~/.ssh/runpod_key
          chmod 600 ~/.ssh/runpod_key
          ssh-keygen -y -f ~/.ssh/runpod_key > ~/.ssh/runpod_key.pub

      - name: Create pod
        id: create
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GPU_TYPE_IDS: ${{ inputs.gpu_types || 'NVIDIA GeForce RTX 4090,NVIDIA RTX A5000,NVIDIA A40,NVIDIA L40S,NVIDIA GeForce RTX 3090' }}
          POD_TEMPLATE_ID: ${{ inputs.template_id }}
          POD_IMAGE: ${{ inputs.image || 'runpod/pytorch:2.1.0-py3.10-cuda11.8.0-devel-ubuntu22.04' }}
          POD_NAME: ai-risk-discovery-${{ github.run_number }}
          POD_CLOUD_TYPE: "SECURE"
          CONTAINER_DISK_GB: "40"
          VOLUME_GB: "40"
        run: |
          set +e
          PUBLIC_KEY="$(cat ~/.ssh/runpod_key.pub)" \
            python scripts/runpod_pod.py create > pod_id.txt
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=Discovery skipped::No GPU capacity available - skipping this run (not a failure)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "create failed with exit code $rc" >&2
            exit "$rc"
          fi
          POD_ID="$(tail -n1 pod_id.txt)"
          echo "RP_POD_ID=$POD_ID" >> "$GITHUB_ENV"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "Created pod: $POD_ID"

      - name: Wait for SSH
        if: steps.create.outputs.proceed == 'true'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          EP="$(python scripts/runpod_pod.py wait --pod-id "$RP_POD_ID" --timeout 1200 --interval 15)"
          echo "RP_HOST=$(echo "$EP" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "RP_PORT=$(echo "$EP" | cut -d' ' -f2)" >> "$GITHUB_ENV"
          echo "Pod SSH at $EP"

      - name: Run discovery on the pod
        if: steps.create.outputs.proceed == 'true'
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          SSH_OPTS="-i ~/.ssh/runpod_key -p $RP_PORT \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ServerAliveInterval=60 -o ServerAliveCountMax=60"
          # sshd may need a few seconds after the port opens - confirm auth works first.
          n=0
          until ssh $SSH_OPTS "root@$RP_HOST" true 2>/dev/null; do
            n=$((n + 1))
            if [ "$n" -ge 10 ]; then echo "SSH never became reachable" >&2; exit 1; fi
            echo "waiting for sshd to accept connections (attempt $n)..."
            sleep 15
          done
          echo "SSH is up; running the pipeline on the pod."
          ssh $SSH_OPTS "root@$RP_HOST" \
            "WORKDIR='$REMOTE_WORKDIR' CONFIG='${{ inputs.config || 'config/ci.yaml' }}' \
             SEMANTIC_SCHOLAR_API_KEY='$SEMANTIC_SCHOLAR_API_KEY' \
             OPENALEX_MAILTO='$OPENALEX_MAILTO' \
             UNPAYWALL_EMAIL='$UNPAYWALL_EMAIL' \
             SERPAPI_API_KEY='$SERPAPI_API_KEY' \
             bash -s" < scripts/pod_discovery.sh

      - name: Fetch run back from the pod
        if: steps.create.outputs.proceed == 'true'
        run: |
          mkdir -p data/output
          scp -i ~/.ssh/runpod_key -P "$RP_PORT" \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            "root@$RP_HOST:$REMOTE_WORKDIR/data/output/latest.json" \
            data/output/latest.json

      - name: Merge into corpus + rebuild site data
        if: steps.create.outputs.proceed == 'true'
        run: |
          python merge_corpus.py --run data/output/latest.json --corpus corpus.json --snapshot-dir snapshots
          python build_data.py -i corpus.json -o docs/risk_data.js -e excerpts.json

      - name: Commit results
        if: steps.create.outputs.proceed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus.json docs/risk_data.js snapshots
          if git diff --cached --quiet; then
            echo "No new papers this run."
          else
            git commit -m "feat(data): discovery run $(date -u +%Y-%m-%d)"
            git push || { git pull --rebase --autostash && git push; }
          fi

      # CRITICAL cost safety: terminate no matter what. Terminate by id if we have
      # one, then sweep by this run's unique pod name to catch any pod a slow create
      # may have left without returning an id.
      - name: Terminate pod
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_NAME: ai-risk-discovery-${{ github.run_number }}
        run: |
          if [ -n "${RP_POD_ID:-}" ]; then
            python scripts/runpod_pod.py terminate --pod-id "$RP_POD_ID"
          fi
          python scripts/runpod_pod.py cleanup --name "$POD_NAME"

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-results
          path: data/output/
          retention-days: 30
          if-no-files-found: ignore
