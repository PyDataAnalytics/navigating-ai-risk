name: discovery

# Weekly NEW-paper discovery on your own GPU. This job CREATES A FRESH RunPod
# pod each run (more reliable than resuming a pinned one - a stopped pod can
# fail to resume when its original host has no free GPU), runs the real Ollama
# pipeline ON the pod (keeping the "no third-party LLM" posture), pulls the run
# back, folds it into the corpus, commits, and ALWAYS terminates the pod. The
# GPU only bills while a run is in flight.
#
# A permissive GPU list (gpu_types) maximises the odds of getting a GPU: an 8B
# model fits on any 24GB+ card, so cheaper/plentiful GPUs are listed first and
# RunPod picks whichever is free (gpuTypePriority + dataCenterPriority:
# availability). Lightweight citation/OA upkeep is the separate, free,
# GPU-less weekly-refresh.yml.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   RUNPOD_API_KEY   create/wait/terminate the pod
#   RUNPOD_SSH_KEY   PRIVATE SSH key (base64); its public half is injected into
#                    the new pod at create time via PUBLIC_KEY
# Optional (forwarded into the run on the pod):
#   SEMANTIC_SCHOLAR_API_KEY, OPENALEX_MAILTO, UNPAYWALL_EMAIL, SERPAPI_API_KEY
#
# NOTE: RUNPOD_POD_ID is no longer used - pods are created on demand.

on:
  schedule:
    - cron: "0 4 * * 0"     # 04:00 UTC Sunday (refresh runs Monday, so no clash)
  workflow_dispatch:
    inputs:
      gpu_types:
        description: "Comma-separated RunPod GPU type ids to try (any order)"
        default: "NVIDIA GeForce RTX 4090,NVIDIA L40S,NVIDIA RTX A5000,NVIDIA A40,NVIDIA A100 80GB PCIe"
      template_id:
        description: "RunPod template id to create from (recommended; overrides image)"
        default: ""
      image:
        description: "Container image (used only if template_id is blank)"
        default: "runpod/pytorch:2.1.0-py3.10-cuda11.8.0-devel-ubuntu22.04"
      config:
        description: "Pipeline config on the pod"
        default: "config/ci.yaml"

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

env:
  REMOTE_WORKDIR: /workspace/ai-risk-retrieval-work/navigating-ai-risk

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write SSH keypair
        env:
          RUNPOD_SSH_KEY_B64: ${{ secrets.RUNPOD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Stored base64-encoded so Windows/PowerShell encoding quirks can never
          # corrupt the key on its way into the secret.
          printf '%s' "$RUNPOD_SSH_KEY_B64" | base64 -d > ~/.ssh/runpod_key
          chmod 600 ~/.ssh/runpod_key
          # Derive the public half to inject into the fresh pod at create time.
          ssh-keygen -y -f ~/.ssh/runpod_key > ~/.ssh/runpod_key.pub

      - name: Create pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GPU_TYPE_IDS: ${{ inputs.gpu_types || 'NVIDIA GeForce RTX 4090,NVIDIA L40S,NVIDIA RTX A5000,NVIDIA A40,NVIDIA A100 80GB PCIe' }}
          POD_TEMPLATE_ID: ${{ inputs.template_id }}
          POD_IMAGE: ${{ inputs.image || 'runpod/pytorch:2.1.0-py3.10-cuda11.8.0-devel-ubuntu22.04' }}
          POD_NAME: ai-risk-discovery-${{ github.run_number }}
          CONTAINER_DISK_GB: "40"
          VOLUME_GB: "40"
        run: |
          PUBLIC_KEY="$(cat ~/.ssh/runpod_key.pub)" \
            python scripts/runpod_pod.py create > pod_id.txt
          POD_ID="$(tail -n1 pod_id.txt)"
          if [ -z "$POD_ID" ]; then echo "create produced no pod id" >&2; exit 1; fi
          echo "RP_POD_ID=$POD_ID" >> "$GITHUB_ENV"
          echo "Created pod: $POD_ID"

      - name: Wait for SSH
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          EP="$(python scripts/runpod_pod.py wait --pod-id "$RP_POD_ID" --timeout 900 --interval 12)"
          echo "RP_HOST=$(echo "$EP" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "RP_PORT=$(echo "$EP" | cut -d' ' -f2)" >> "$GITHUB_ENV"
          echo "Pod SSH at $EP"

      - name: Run discovery on the pod
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          ssh -i ~/.ssh/runpod_key -p "$RP_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=60 -o ServerAliveCountMax=60 \
            "root@$RP_HOST" \
            "WORKDIR='$REMOTE_WORKDIR' CONFIG='${{ inputs.config || 'config/ci.yaml' }}' \
             SEMANTIC_SCHOLAR_API_KEY='$SEMANTIC_SCHOLAR_API_KEY' \
             OPENALEX_MAILTO='$OPENALEX_MAILTO' \
             UNPAYWALL_EMAIL='$UNPAYWALL_EMAIL' \
             SERPAPI_API_KEY='$SERPAPI_API_KEY' \
             bash -s" < scripts/pod_discovery.sh

      - name: Fetch run back from the pod
        run: |
          mkdir -p data/output
          scp -i ~/.ssh/runpod_key -P "$RP_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "root@$RP_HOST:$REMOTE_WORKDIR/data/output/latest.json" \
            data/output/latest.json

      - name: Merge into corpus + rebuild site data
        run: |
          python merge_corpus.py --run data/output/latest.json --corpus corpus.json --snapshot-dir snapshots
          python build_data.py -i corpus.json -o docs/risk_data.js -e excerpts.json

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus.json docs/risk_data.js snapshots
          if git diff --cached --quiet; then
            echo "No new papers this run."
          else
            git commit -m "feat(data): discovery run $(date -u +%Y-%m-%d)"
            git push || { git pull --rebase --autostash && git push; }
          fi

      # CRITICAL cost safety: terminate the pod no matter what happened above
      # (success, failure, or cancellation). Guarded so a failed create is a no-op.
      - name: Terminate pod
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          if [ -n "${RP_POD_ID:-}" ]; then
            python scripts/runpod_pod.py terminate --pod-id "$RP_POD_ID"
          else
            echo "No pod was created - nothing to terminate."
          fi

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-results
          path: data/output/
          retention-days: 30
