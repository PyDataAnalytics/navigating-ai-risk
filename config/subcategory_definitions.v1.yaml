# AI Risk Taxonomy — Subcategory Definitions
# ============================================
#
# Companion to taxonomy.yaml. For each leaf subcategory, this file provides:
#
#   one_line:          A single-sentence definition (≤25 words)
#   applies_when:      Concrete conditions that trigger this subcategory
#   does_not_apply_when: Negative anchors distinguishing from siblings
#   user_signals:      Natural-language phrases users would say
#   adjacent_to:       Related/often-confused subcategories
#   nature:            operational | regulatory | behavioral | systemic
#                      Hints at default surfacing emphasis
#   elements:          The six-element decomposition (threat, event,
#                      operational_artifacts, mitigations_controls,
#                      regulatory_standards, research) with population
#                      level: heavy | moderate | light | empty
#
# Population levels indicate expected content density. Empty elements
# are kept in the schema for consistency — their absence is itself
# informative ("this subcategory has no associated active threats").
#
# This file is consumed by the matcher LLM at query time. The structure
# is optimized for machine reading, not human browsing.
#
# Version: 1.0
# Companion to: taxonomy.yaml v1.0

version: "1.0"

subcategories:

  # ════════════════════════════════════════════════════════════════════
  # Category 1 — Technical & Reliability Risks
  # ════════════════════════════════════════════════════════════════════

  - name: "Hallucinations"
    nature: operational
    one_line: "An LLM produces confident outputs that are factually wrong or fabricated, in the absence of any adversary."
    applies_when:
      - "An LLM generates content presented as factual"
      - "Users may rely on outputs without independent verification"
      - "Outputs include citations, names, dates, or specific claims that could be wrong"
      - "The model is used in a domain where accuracy matters (research, medicine, law, finance)"
    does_not_apply_when:
      - "Wrong outputs are the result of adversarial input (that's Prompt injection or Adversarial examples)"
      - "Outputs are creative content with no factual claim"
      - "The concern is fabricated citations specifically (that's Fabricated citations or sources)"
    user_signals:
      - "model makes things up"
      - "confidently wrong"
      - "wrong facts"
      - "users will trust the output"
      - "LLM for research"
      - "summarization accuracy"
    adjacent_to:
      - "Fabricated citations or sources"
      - "Incorrect reasoning"
      - "Misunderstanding context or intent"
      - "Silent degradation over time"
    elements:
      threat:
        population: light
        notes: "Not an attacker-driven phenomenon, but documented failure modes exist"
      event:
        population: moderate
        notes: "Real-world incidents (lawyer citing fake cases, medical misdiagnosis) are well documented"
      operational_artifacts:
        population: moderate
        notes: "Specific models with known hallucination rates; benchmarks like TruthfulQA, HaluEval"
      mitigations_controls:
        population: heavy
        notes: "RAG grounding, citation verification, uncertainty quantification, RLHF improvements"
      regulatory_standards:
        population: moderate
        notes: "EU AI Act accuracy requirements; sector-specific (FDA on medical AI, bar associations on legal AI)"
      research:
        population: heavy
        notes: "Large active literature on causes, measurement, mitigation"

  - name: "Fabricated citations or sources"
    nature: operational
    one_line: "An LLM generates references to papers, cases, books, or sources that do not exist or do not say what is claimed."
    applies_when:
      - "An LLM produces outputs that include citations or references to external sources"
      - "Users may rely on cited material without verifying it exists"
      - "Use is in academic, legal, journalistic, or research contexts"
      - "The output format encourages or requires citations"
    does_not_apply_when:
      - "The concern is general factual error, not citation specifically (that's Hallucinations)"
      - "Citations exist but their content is misrepresented (that's Hallucinations or Incorrect reasoning)"
    user_signals:
      - "fake citations"
      - "made-up references"
      - "lawyer cited nonexistent cases"
      - "fake DOIs"
      - "hallucinated papers"
      - "ChatGPT cited paper that doesn't exist"
    adjacent_to:
      - "Hallucinations"
      - "Automated plagiarism"
      - "Fake scientific papers by AI"
    elements:
      threat:
        population: light
      event:
        population: moderate
        notes: "Mata v. Avianca (lawyer ChatGPT case) and similar widely-documented incidents"
      operational_artifacts:
        population: light
        notes: "Benchmarks measuring citation accuracy; some models specifically tuned for citation reliability"
      mitigations_controls:
        population: moderate
        notes: "Retrieval-augmented citation verification, DOI checking, structured output enforcement"
      regulatory_standards:
        population: light
        notes: "Professional standards (bar associations, academic integrity policies)"
      research:
        population: moderate

  - name: "Incorrect reasoning"
    nature: operational
    one_line: "An LLM produces outputs reflecting logical, causal, or inferential errors despite appearing coherent."
    applies_when:
      - "An LLM is used for tasks requiring multi-step reasoning, deduction, or inference"
      - "Output quality depends on logical correctness, not just factual accuracy"
      - "Chain-of-thought or similar reasoning is exposed to users"
      - "Errors in reasoning could compound or mislead"
    does_not_apply_when:
      - "The error is factual recall, not reasoning (that's Hallucinations)"
      - "The error is specifically in arithmetic or formal logic (that's Arithmetic and logical errors)"
      - "Reasoning is correct but assumes wrong premises (that's Misunderstanding context)"
    user_signals:
      - "model reasons incorrectly"
      - "logical errors"
      - "chain of thought wrong"
      - "model jumps to wrong conclusion"
      - "reasoning doesn't follow"
    adjacent_to:
      - "Arithmetic and logical errors"
      - "Hallucinations"
      - "Misunderstanding context or intent"
    elements:
      threat:
        population: light
      event:
        population: light
        notes: "Incidents harder to isolate from broader hallucination/error categories"
      operational_artifacts:
        population: moderate
        notes: "Reasoning benchmarks (GSM8K, MATH, BBH, ARC); specific reasoning-tuned models"
      mitigations_controls:
        population: moderate
        notes: "Self-consistency, verification chains, structured reasoning prompts, tool use"
      regulatory_standards:
        population: light
      research:
        population: heavy
        notes: "Very active research area — chain-of-thought, tree-of-thought, reasoning models"

  - name: "Arithmetic and logical errors"
    nature: operational
    one_line: "An LLM produces incorrect outputs on tasks involving calculation, formal logic, or quantitative reasoning."
    applies_when:
      - "An LLM is used for tasks involving numerical computation"
      - "Output involves comparisons, logical operators, or formal proofs"
      - "Mathematical correctness is required for downstream use"
      - "The model is used without external calculation tools"
    does_not_apply_when:
      - "The model uses a calculator/code interpreter to handle math (error mode is different)"
      - "The error is in general reasoning, not arithmetic (that's Incorrect reasoning)"
    user_signals:
      - "model can't do math"
      - "arithmetic errors"
      - "wrong calculations"
      - "LLM bad at numbers"
      - "logic errors"
    adjacent_to:
      - "Incorrect reasoning"
      - "Hallucinations"
    elements:
      threat:
        population: empty
      event:
        population: light
      operational_artifacts:
        population: moderate
        notes: "Standard benchmarks (GSM8K, MATH); models with strong vs weak math capability"
      mitigations_controls:
        population: moderate
        notes: "Tool use (code interpreter, calculator), verifiers, structured math output"
      regulatory_standards:
        population: empty
      research:
        population: heavy

  - name: "Misunderstanding context or intent"
    nature: operational
    one_line: "An LLM produces outputs that miss what the user actually wanted, due to misreading context, ambiguity, or implicit intent."
    applies_when:
      - "User queries contain ambiguity, implicit assumptions, or unstated context"
      - "The system must infer intent from partial information"
      - "Misinterpretation leads to confidently wrong outputs (not just no answer)"
      - "Multi-turn or context-heavy interactions where prior context matters"
    does_not_apply_when:
      - "The model understood correctly but factual content is wrong (Hallucinations)"
      - "User intent is hostile and the model is being manipulated (Prompt injection)"
    user_signals:
      - "model misunderstood what I wanted"
      - "wrong interpretation"
      - "missed the context"
      - "didn't get what I meant"
      - "answered different question"
    adjacent_to:
      - "Hallucinations"
      - "Incorrect reasoning"
      - "Poor monitoring or observability"
    elements:
      threat:
        population: empty
      event:
        population: light
      operational_artifacts:
        population: light
      mitigations_controls:
        population: moderate
        notes: "Clarification prompts, intent classification, context window management, RLHF on instruction following"
      regulatory_standards:
        population: empty
      research:
        population: moderate
        notes: "Instruction-following research, pragmatic understanding studies"

  - name: "Overfitting and underfitting"
    nature: operational
    one_line: "An ML model either memorizes training data without generalizing (overfitting) or fails to capture underlying patterns (underfitting)."
    applies_when:
      - "Custom ML models are being trained or fine-tuned"
      - "Model performance differs significantly between training and validation/test sets"
      - "Decisions about model architecture, regularization, or training duration are being made"
      - "Production model quality is degrading or never met expectations"
    does_not_apply_when:
      - "Using pre-trained foundation models without fine-tuning (rarely the relevant concern)"
      - "The issue is data distribution shift after deployment (that's Distribution shift failures)"
    user_signals:
      - "model overfits"
      - "training accuracy high, test accuracy low"
      - "model doesn't generalize"
      - "underfitting"
      - "high variance"
      - "high bias"
    adjacent_to:
      - "Brittleness outside training distribution"
      - "Distribution shift failures"
      - "Catastrophic forgetting"
    elements:
      threat:
        population: empty
      event:
        population: empty
      operational_artifacts:
        population: moderate
        notes: "Standard ML training frameworks, regularization libraries, hyperparameter tuning tools"
      mitigations_controls:
        population: heavy
        notes: "Regularization, cross-validation, early stopping, dropout, data augmentation — well-established ML practice"
      regulatory_standards:
        population: light
      research:
        population: heavy
        notes: "Foundational ML theory and ongoing research"

  - name: "Brittleness outside training distribution"
    nature: operational
    one_line: "An ML model performs well on data similar to its training set but fails unpredictably on inputs outside that distribution."
    applies_when:
      - "An ML system is deployed in environments that may differ from training conditions"
      - "Input distribution at deployment differs from training distribution"
      - "Edge cases, rare inputs, or novel scenarios are possible"
      - "System decisions affect real-world outcomes where failure has cost"
    does_not_apply_when:
      - "The issue is training-time fitting problems (that's Overfitting)"
      - "Distribution changes over time after deployment (that's Distribution shift failures)"
      - "Adversaries deliberately craft OOD inputs (that's Adversarial examples)"
    user_signals:
      - "out of distribution"
      - "OOD"
      - "model fails on edge cases"
      - "doesn't handle new data"
      - "brittleness"
      - "generalization failures"
    adjacent_to:
      - "Distribution shift failures"
      - "Overfitting and underfitting"
      - "Adversarial examples"
      - "Failure under adversarial inputs"
    elements:
      threat:
        population: light
      event:
        population: moderate
        notes: "Autonomous vehicle incidents, medical AI misclassifications outside training population"
      operational_artifacts:
        population: moderate
        notes: "OOD detection libraries, robustness benchmarks (ImageNet-C, etc.)"
      mitigations_controls:
        population: moderate
        notes: "OOD detection, calibration, conformal prediction, ensemble methods, domain adaptation"
      regulatory_standards:
        population: moderate
        notes: "EU AI Act robustness requirements; medical device regulations on AI"
      research:
        population: heavy

  - name: "Failure under adversarial inputs"
    nature: operational
    one_line: "An ML model produces incorrect outputs when inputs are crafted to exploit model weaknesses, even without explicit attacker goals."
    applies_when:
      - "An ML system processes inputs from untrusted sources"
      - "Adversarial robustness has not been explicitly tested"
      - "The system is used in security-sensitive or high-stakes contexts"
      - "Input formats allow adversarial crafting (images, text, audio)"
    does_not_apply_when:
      - "The attack specifically targets LLM instructions via natural language (Prompt injection)"
      - "Inputs are non-adversarial but distribution-shifted (Brittleness outside training distribution)"
    user_signals:
      - "adversarial robustness"
      - "model fooled by inputs"
      - "evasion attacks"
      - "perturbed inputs"
      - "model fragility"
    adjacent_to:
      - "Adversarial examples"
      - "Prompt injection attacks"
      - "Brittleness outside training distribution"
      - "Jailbreaks"
    elements:
      threat:
        population: heavy
        notes: "ATLAS Evade ML Model techniques; well-catalogued attack patterns"
      event:
        population: moderate
        notes: "Documented attacks on face recognition, medical imaging, autonomous driving"
      operational_artifacts:
        population: moderate
        notes: "Adversarial robustness toolboxes (ART, Foolbox, CleverHans); robust models"
      mitigations_controls:
        population: heavy
        notes: "Adversarial training, certified defenses, input preprocessing, randomized smoothing"
      regulatory_standards:
        population: moderate
      research:
        population: heavy

  - name: "Prompt injection attacks"
    nature: operational
    one_line: "Attackers craft inputs that override an LLM's instructions, causing it to behave against operator intent."
    applies_when:
      - "Untrusted text (user input, retrieved documents, tool outputs, web content) reaches an LLM that also receives privileged instructions"
      - "An agent processes external content (emails, web pages, files) and acts on what it reads"
      - "A RAG system retrieves documents whose content could include instructions"
      - "Multiple trust levels share the same model context"
    does_not_apply_when:
      - "The system only processes trusted, operator-controlled prompts"
      - "The concern is the model producing wrong answers absent any adversary (Hallucinations)"
      - "The attack is on the model's safety training rather than runtime context (Jailbreaks)"
    user_signals:
      - "agents"
      - "tool use"
      - "RAG"
      - "retrieval"
      - "agent reads emails"
      - "browses the web"
      - "users can input anything"
      - "model ignores instructions"
    adjacent_to:
      - "Jailbreaks"
      - "Sensitive document extraction"
      - "Leakage of confidential data by LLMs"
      - "Failure under adversarial inputs"
    elements:
      threat:
        population: heavy
        notes: "ATLAS AML.T0051 (LLM Prompt Injection), direct and indirect variants; OWASP LLM01"
      event:
        population: heavy
        notes: "Morris II Worm, ChatGPT Plugin Privacy Leak, ongoing vendor advisories"
      operational_artifacts:
        population: moderate
        notes: "Specific RAG/agent frameworks with known injection surfaces (LangChain, LlamaIndex)"
      mitigations_controls:
        population: heavy
        notes: "Input sanitization, privilege separation, structured output, dual-LLM patterns, output filtering"
      regulatory_standards:
        population: moderate
        notes: "EU AI Act Article 15 (cybersecurity); NIST AI RMF Measure 2.7"
      research:
        population: heavy

  - name: "Jailbreaks"
    nature: operational
    one_line: "Users bypass an LLM's safety training to elicit content the model was trained to refuse."
    applies_when:
      - "An LLM has safety training intended to refuse certain content"
      - "Users have direct access to model inputs"
      - "Refusal behavior is part of the model's deployment requirements"
      - "Bypass would produce harmful, illegal, or policy-violating content"
    does_not_apply_when:
      - "The bypass is via embedded content rather than direct prompting (Prompt injection)"
      - "The model wasn't trained to refuse the content in the first place"
    user_signals:
      - "jailbreak"
      - "DAN prompts"
      - "safety bypass"
      - "users get around restrictions"
      - "model produces harmful content"
      - "refusal training"
    adjacent_to:
      - "Prompt injection attacks"
      - "Dangerous advice generation"
      - "Chemical and biological hazard assistance"
      - "Malware generation by LLMs"
    elements:
      threat:
        population: heavy
        notes: "ATLAS LLM Jailbreak technique; large catalog of documented bypass patterns"
      event:
        population: moderate
        notes: "Ongoing public jailbreak demonstrations; vendor red-team reports"
      operational_artifacts:
        population: moderate
        notes: "Jailbreak benchmarks (HarmBench, JailbreakBench); specific models with known weaknesses"
      mitigations_controls:
        population: heavy
        notes: "Constitutional AI, RLHF, classifier guardrails, refusal training, monitoring"
      regulatory_standards:
        population: moderate
        notes: "EU AI Act prohibited practices; vendor responsible AI commitments"
      research:
        population: heavy

  - name: "Adversarial examples"
    nature: operational
    one_line: "Inputs deliberately crafted with imperceptible perturbations that cause an ML model to misclassify them."
    applies_when:
      - "An ML system processes structured inputs (images, audio, text) from untrusted sources"
      - "Security context where adversaries have motive to fool the model"
      - "Model decisions have material consequences (authentication, content moderation, autonomous systems)"
    does_not_apply_when:
      - "Inputs are large perturbations or natural OOD (Brittleness outside training distribution)"
      - "The target is an LLM via natural language (Prompt injection)"
    user_signals:
      - "adversarial perturbation"
      - "evasion attacks"
      - "imperceptible noise"
      - "FGSM"
      - "PGD attacks"
      - "model fooled by tiny changes"
    adjacent_to:
      - "Failure under adversarial inputs"
      - "Brittleness outside training distribution"
      - "Prompt injection attacks"
    elements:
      threat:
        population: heavy
        notes: "ATLAS Evade ML Model; extensive attack catalog (FGSM, PGD, C&W, etc.)"
      event:
        population: moderate
        notes: "Documented attacks on facial recognition, road sign classifiers, malware detectors"
      operational_artifacts:
        population: moderate
        notes: "Adversarial robustness toolboxes; certified-robust models"
      mitigations_controls:
        population: heavy
        notes: "Adversarial training, certified defenses (randomized smoothing), detection methods"
      regulatory_standards:
        population: moderate
      research:
        population: heavy
        notes: "Mature research area with established benchmarks"

  - name: "Data poisoning"
    nature: operational
    one_line: "Adversaries corrupt training data so the resulting model behaves incorrectly on specific inputs or in specific conditions."
    applies_when:
      - "Models are trained on data from untrusted or external sources (scraped web, user-contributed, partner-provided)"
      - "Training pipelines accept inputs without comprehensive provenance checks"
      - "Backdoors or specific failure modes would have material impact"
      - "Open-source models or datasets are being fine-tuned"
    does_not_apply_when:
      - "Compromise is at inference time, not training time (Prompt injection, Adversarial examples)"
      - "The training pipeline itself is compromised at the software level (Compromised training pipelines)"
    user_signals:
      - "training data poisoning"
      - "backdoor attack"
      - "trojan models"
      - "poisoned datasets"
      - "PoisonGPT"
      - "model behaves wrong on specific inputs"
    adjacent_to:
      - "Compromised training pipelines"
      - "Supply-chain attacks on AI"
      - "Memorized training data exposure"
      - "Training on private data without consent"
    elements:
      threat:
        population: heavy
        notes: "ATLAS AML.T0018 (Poison Training Data), AML.T0019 (Publish Poisoned Models); well-catalogued"
      event:
        population: heavy
        notes: "PoisonGPT case study, documented dataset poisoning incidents on HuggingFace"
      operational_artifacts:
        population: heavy
        notes: "MITRE AI Risk Database tracks vulnerable models; specific known-poisoned model entries"
      mitigations_controls:
        population: heavy
        notes: "Data provenance, model signing, anomaly detection in training data, trusted sources, SBOMs for ML"
      regulatory_standards:
        population: moderate
        notes: "Supply chain security regulations; NIST guidance on ML supply chain"
      research:
        population: heavy

  - name: "Distribution shift failures"
    nature: operational
    one_line: "An ML model's performance degrades when real-world data distribution changes over time after deployment."
    applies_when:
      - "An ML system is deployed in environments where input or label distributions can change"
      - "Long-running production systems without continuous retraining"
      - "Domain or population characteristics may shift (seasons, demographics, behavior patterns, hardware)"
      - "Performance monitoring is not continuous or thorough"
    does_not_apply_when:
      - "Initial training-time distribution mismatch (Brittleness outside training distribution)"
      - "Adversarial inputs (Adversarial examples)"
      - "Gradual model degradation from other causes (Silent degradation over time)"
    user_signals:
      - "distribution shift"
      - "data drift"
      - "model performance degrades over time"
      - "concept drift"
      - "covariate shift"
      - "model needs retraining"
    adjacent_to:
      - "Silent degradation over time"
      - "Brittleness outside training distribution"
      - "Poor monitoring or observability"
    elements:
      threat:
        population: empty
      event:
        population: moderate
        notes: "COVID-era model failures (purchasing patterns, content moderation); various documented production incidents"
      operational_artifacts:
        population: moderate
        notes: "Drift detection libraries (Evidently, Alibi Detect, Whylogs)"
      mitigations_controls:
        population: heavy
        notes: "Continuous monitoring, retraining pipelines, drift detection, performance alerts"
      regulatory_standards:
        population: moderate
        notes: "EU AI Act post-market monitoring; medical device AI lifecycle requirements"
      research:
        population: heavy

  - name: "Catastrophic forgetting"
    nature: operational
    one_line: "A model trained incrementally on new data loses performance on previously learned tasks or knowledge."
    applies_when:
      - "Models undergo continual learning, online learning, or sequential fine-tuning"
      - "Fine-tuning is applied to pre-trained foundation models"
      - "Domain adaptation involves training on new data without full retention of original"
      - "Multi-task or multi-domain systems use shared parameters"
    does_not_apply_when:
      - "Gradual degradation from non-training causes (Silent degradation over time)"
      - "Performance issues at initial training (Overfitting/Underfitting)"
    user_signals:
      - "catastrophic forgetting"
      - "fine-tuning broke the model"
      - "continual learning"
      - "model lost previous capabilities"
      - "negative transfer"
    adjacent_to:
      - "Silent degradation over time"
      - "Distribution shift failures"
      - "Overfitting and underfitting"
    elements:
      threat:
        population: empty
      event:
        population: light
      operational_artifacts:
        population: moderate
        notes: "Continual learning benchmarks; EWC, replay, LoRA methods"
      mitigations_controls:
        population: heavy
        notes: "Elastic weight consolidation, replay buffers, parameter-efficient fine-tuning, modular architectures"
      regulatory_standards:
        population: light
      research:
        population: heavy

  - name: "Unexpected emergent behaviors"
    nature: systemic
    one_line: "Capabilities or behaviors appear in large models that were not present in smaller versions and were not deliberately trained for."
    applies_when:
      - "Large foundation models are being deployed or scaled"
      - "Capability assumptions are based on smaller-scale testing"
      - "Novel use cases or scales are being explored"
      - "Concerns about unforeseen risks at scale"
    does_not_apply_when:
      - "Behaviors are deliberately trained (RLHF, instruction following)"
      - "The behavior is misalignment specifically (Goal misgeneralization, Deceptive alignment)"
    user_signals:
      - "emergent capabilities"
      - "unexpected abilities"
      - "scaling surprises"
      - "model can do things it wasn't trained for"
      - "phase transitions"
    adjacent_to:
      - "Unpredictable outputs"
      - "Goal misgeneralization"
      - "Loss of human control over superintelligence"
      - "Recursive self-improvement"
    elements:
      threat:
        population: light
      event:
        population: light
        notes: "Documented capability surprises (GPT-4 multimodal, chain-of-thought emergence)"
      operational_artifacts:
        population: moderate
        notes: "Capability evaluations (HELM, BIG-bench); dangerous capability evals (BioLP-bench, etc.)"
      mitigations_controls:
        population: moderate
        notes: "Pre-deployment capability evaluations, red teaming, gradual rollout, evals at scale"
      regulatory_standards:
        population: moderate
        notes: "EU AI Act systemic risk evaluations; UK AISI / US CAISI frontier evaluations"
      research:
        population: heavy

  - name: "Objective misspecification"
    nature: systemic
    one_line: "The objective given to an AI system fails to capture what the operator actually wants, leading to undesired optimization."
    applies_when:
      - "ML systems are optimized for proxy metrics (engagement, clicks, accuracy on benchmark)"
      - "Reinforcement learning systems with hand-designed reward functions"
      - "The 'true' objective is hard to specify formally"
      - "Optimization pressure is high (large compute, long training, autonomous systems)"
    does_not_apply_when:
      - "The objective is specified correctly but the model gains it in unintended ways (Reward hacking, Proxy gaming)"
      - "The model develops inner objectives different from training (Inner misalignment)"
    user_signals:
      - "wrong objective"
      - "optimizing the wrong thing"
      - "proxy metric"
      - "Goodhart's law"
      - "specification problem"
    adjacent_to:
      - "Reward hacking"
      - "Proxy gaming"
      - "Goal misgeneralization"
      - "Specification gaming"
    elements:
      threat:
        population: empty
      event:
        population: light
        notes: "Recommendation system engagement-optimization harms (social media radicalization)"
      operational_artifacts:
        population: light
      mitigations_controls:
        population: moderate
        notes: "Constitutional AI, RLHF, inverse reward design, multi-objective optimization, human oversight"
      regulatory_standards:
        population: light
      research:
        population: heavy
        notes: "Core alignment research area"

  - name: "Reward hacking"
    nature: systemic
    one_line: "An RL agent achieves high reward through unintended exploits of the reward function rather than by accomplishing the intended task."
    applies_when:
      - "Reinforcement learning systems with explicit reward functions"
      - "Agent has sufficient capability to discover unintended high-reward strategies"
      - "Reward function is a hand-designed proxy for desired behavior"
      - "Long-horizon optimization where unintended strategies have time to develop"
    does_not_apply_when:
      - "The reward function correctly captures intent (then the problem is execution, not hacking)"
      - "Specifically about specification gaming in general (Specification gaming)"
      - "Self-stimulation of reward signal (Wireheading)"
    user_signals:
      - "reward hacking"
      - "agent gaming the reward"
      - "shortcuts in reward function"
      - "found a loophole"
    adjacent_to:
      - "Specification gaming"
      - "Proxy gaming"
      - "Wireheading"
      - "Objective misspecification"
    elements:
      threat:
        population: empty
      event:
        population: light
        notes: "Documented RL training incidents (boat racing game, simulated robotics failures)"
      operational_artifacts:
        population: light
      mitigations_controls:
        population: moderate
