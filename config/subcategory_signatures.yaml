  # ───── Meta-Risks (Risks About Risk Management) ─────

  - name: "Safety theater in AI"
    one_line: "AI safety practices are performed publicly without substantive risk reduction — model cards, ethics statements, RLHF disclosures, and audits used as legitimacy signals rather than risk controls."
    signals: ["AI safety theater", "ethics washing", "AI ethics performance", "AI safety performance", "model card limitations"]

  - name: "Underestimating AI risks"
    one_line: "Decision-makers — in industry, government, and civil society — systematically underestimate AI risks due to inexperience, optimism bias, competitive pressure, or limited evaluation evidence."
    signals: ["underestimating AI risk", "AI risk blindness", "AI risk denial", "MIT AI Risk Repository", "AI Incident Database underreporting"]

  - name: "Overregulation stifling beneficial AI innovation"
    one_line: "Excessively restrictive AI regulation may suppress beneficial innovation — small developers, open-source, academic research, and high-value applications constrained beyond what risk-mitigation requires."
    signals: ["AI overregulation", "EU AI Act burden", "AI compliance cost", "open source AI regulation", "SB 1047 chilling"]

  - name: "Regulatory lag for AI"
    one_line: "AI capabilities and deployments evolve faster than regulators can develop and implement rules, leaving harmful uses with inadequate response and beneficial uses with uncertainty."
    signals: ["regulation lagging AI", "AI moves faster than regulation", "AI regulatory gap", "Collingridge dilemma AI", "AI policy lag"]

  - name: "International AI prisoner's dilemma"
    one_line: "States face race-to-the-bottom dynamics in AI development — each fearing that competitors will achieve advantage by skimping on safety, leading to collectively suboptimal under-investment in safety."
    signals: ["AI prisoner's dilemma", "AI race to bottom", "AI coordination problem", "US-China AI cooperation", "AI multilateral failure"]

  - name: "Competitive pressure reducing AI safety standards"
    one_line: "Competition between AI labs produces pressure to deploy faster than safety review supports — undermining safety investment, evaluation discipline, and willingness to delay launches."
