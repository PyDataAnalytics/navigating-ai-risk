# AI Risk Taxonomy — Subcategory Signatures (compact)
# =====================================================
# Lightweight companion to subcategory_definitions.yaml for stage-1 embedding retrieval.
# Names match taxonomy.yaml exactly.
#
# Version: 2.0
# Companion to: subcategory_definitions.yaml v2.0

version: "2.0"

signatures:

  # ───── Technical & Reliability Risks ─────

  - name: "Hallucinations"
    one_line: "An LLM produces plausible-sounding content that is factually wrong, fabricated, or unsupported, in the absence of any adversary."
    signals: ["hallucination", "confabulation", "confidently wrong", "ungrounded output", "RAG groundedness"]

  - name: "Fabricated citations or sources"
    one_line: "An LLM generates references — to papers, cases, books, statutes — that either do not exist or do not contain the claim being attributed to them."
    signals: ["fake citations", "hallucinated papers", "fabricated case law", "Mata v. Avianca", "fictitious precedent"]

  - name: "Incorrect reasoning"
    one_line: "An LLM produces output that contains logical, causal, or inferential errors despite surface coherence."
    signals: ["logical errors", "chain of thought wrong", "non-sequitur", "fallacious reasoning", "reasoning failures"]

  - name: "Arithmetic and logical errors"
    one_line: "An LLM produces incorrect results on tasks involving numerical computation, comparison, or formal logical operators."
    signals: ["model can't do math", "wrong calculations", "arithmetic errors", "tokenization breaks math", "date arithmetic wrong"]

  - name: "Misunderstanding context or intent"
    one_line: "An LLM produces output that misreads what the user actually wanted, due to ambiguity, missing context, or wrong assumption about implicit intent."
    signals: ["model misunderstood", "wrong interpretation", "answered different question", "missed the context", "intent recognition"]

  - name: "Overfitting and underfitting"
    one_line: "An ML model either memorizes training data without learning generalizable patterns or fails to capture them at all."
    signals: ["overfitting", "underfitting", "high variance", "doesn't generalize", "bias-variance tradeoff"]

  - name: "Brittleness outside training distribution"
    one_line: "An ML model that performs well on training-like data fails silently on inputs outside the training distribution."
    signals: ["out of distribution", "OOD", "model fails on edge cases", "brittleness", "calibration failure OOD"]

  - name: "Failure under adversarial inputs"
    one_line: "An ML model produces incorrect outputs when inputs are crafted to exploit its specific weaknesses while appearing normal."
    signals: ["adversarial robustness", "evasion attacks", "adversarial ML", "AML", "robustness certification"]

  - name: "Prompt injection attacks"
    one_line: "Attacker-controlled text reaches an LLM's context and causes it to act against operator instructions, directly or indirectly through retrieved content, tool outputs, or supplied data."
    signals: ["prompt injection", "indirect prompt injection", "tool calling vulnerability", "RAG security", "OWASP LLM01"]

  - name: "Jailbreaks"
    one_line: "Users bypass an LLM's safety training to elicit content the model was trained to refuse."
    signals: ["jailbreak", "DAN", "safety bypass", "refusal bypass", "GCG attack"]

  - name: "Adversarial examples"
    one_line: "Inputs deliberately crafted with imperceptible or constrained perturbations that cause an ML model to misclassify them."
    signals: ["adversarial examples", "FGSM", "PGD", "imperceptible perturbation", "physical adversarial"]

  - name: "Data poisoning"
    one_line: "Adversaries corrupt training data so the resulting model behaves incorrectly on specific inputs or conditions, typically through backdoors."
    signals: ["data poisoning", "backdoor attack", "trojan model", "PoisonGPT", "BadNets"]

  - name: "Distribution shift failures"
    one_line: "An ML model's performance degrades after deployment when real-world data drifts away from the training distribution, often silently."
    signals: ["distribution shift", "data drift", "concept drift", "model needs retraining", "covariate shift"]

  - name: "Catastrophic forgetting"
    one_line: "A neural network trained sequentially on new tasks loses performance on previously learned tasks, often abruptly."
    signals: ["catastrophic forgetting", "continual learning", "negative transfer", "alignment tax", "fine-tuning broke the model"]

  - name: "Unexpected emergent behaviors"
    one_line: "Capabilities or behaviors appear in larger models that were not present at smaller scale and were not explicitly trained for."
    signals: ["emergent capabilities", "scaling surprises", "phase transitions", "in-context learning emergence", "capability discontinuity"]

  - name: "Objective misspecification"
    one_line: "The objective formally specified to an AI fails to capture what the operator actually wants, leading to optimization toward technically correct but undesired outcomes."
    signals: ["objective misspecification", "wrong objective", "Goodhart's law", "proxy metric", "reward design"]

  - name: "Reward hacking"
    one_line: "An RL agent achieves high reward through unintended exploits of the reward function rather than by accomplishing the intended task."
    signals: ["reward hacking", "agent gaming the reward", "RLHF gaming", "sycophancy", "reward model exploitation"]

  - name: "Wireheading"
    one_line: "An AI agent directly modifies, short-circuits, or seizes its own reward signal rather than achieving the intended task."
    signals: ["wireheading", "reward tampering", "self-rewarding", "delusion box", "reward signal manipulation"]

  - name: "Proxy gaming"
    one_line: "An optimizer exploits the gap between a proxy metric and the true objective the proxy was intended to measure."
    signals: ["Goodhart's law", "metric gaming", "engagement gaming", "metric collapse", "teaching to the test"]

  - name: "Goal misgeneralization"
    one_line: "A trained model pursues a coherent goal that fits training data but diverges from the intended goal when deployed in different conditions."
    signals: ["goal misgeneralization", "wrong objective generalizes", "capability without alignment", "objective ambiguity"]

  - name: "Instrumental convergence"
    one_line: "Sufficiently capable goal-directed AI is theorized to develop convergent subgoals (self-preservation, resource acquisition) regardless of terminal goals."
    signals: ["instrumental convergence", "power seeking", "self-preservation AI", "Omohundro drives", "shutdown problem"]

  - name: "Deceptive alignment"
    one_line: "A model behaves aligned during training and evaluation but pursues different goals when it perceives deployment or reduced oversight."
    signals: ["deceptive alignment", "alignment faking", "scheming", "sandbagging", "training game"]

  - name: "Inner misalignment"
    one_line: "The internal objective a model effectively pursues differs from the training objective due to mesa-optimization dynamics."
    signals: ["inner alignment", "mesa-optimization", "mesa-objective", "inner optimizer", "outer alignment"]

  - name: "Specification gaming"
    one_line: "An AI satisfies the literal specification of its task while violating the intent — a solution that technically counts but isn't what was wanted."
    signals: ["specification gaming", "letter vs spirit", "loophole exploitation", "test gaming", "edge cases exploited"]

  - name: "Unpredictable outputs"
    one_line: "An LLM produces meaningfully different outputs for the same or similar inputs in ways that affect reliability or downstream systems."
    signals: ["inconsistent outputs", "non-reproducible", "model is flaky", "output variability", "same prompt different answers"]

  - name: "Non-determinism in LLMs"
    one_line: "LLM inference produces different outputs across runs even with fixed seeds, due to floating-point non-associativity and kernel selection variability."
    signals: ["non-deterministic inference", "GPU non-determinism", "can't reproduce results", "batch size affects outputs", "floating point non-determinism"]

  - name: "Cascading system failures"
    one_line: "Failure in one AI component propagates through dependent systems, amplifying impact across interconnected agents, models, and automation."
    signals: ["cascading failures", "agent failures propagate", "multi-agent failure", "compounding errors", "agent pipeline collapse"]

  - name: "Automation complacency"
    one_line: "Human operators over-trust AI outputs and reduce monitoring, failing to catch AI errors they would have caught without the AI."
    signals: ["automation complacency", "rubber stamp AI", "automation bias", "alarm fatigue", "over-reliance on AI"]

  - name: "Silent degradation over time"
    one_line: "Model performance gradually declines in production without triggering alerts, often because monitoring measures the wrong things."
    signals: ["silent degradation", "model drift over time", "stale model", "slow decay", "API model changed underneath us"]

  - name: "Poor monitoring or observability"
    one_line: "AI systems are deployed without sufficient instrumentation to detect problems, understand behavior, or diagnose failures."
    signals: ["no observability", "LLM observability", "no prompt logs", "MLOps observability gap", "no audit trail"]

  - name: "Dependency on external APIs and models"
    one_line: "Production systems built on third-party AI APIs are exposed to vendor changes — deprecations, behavior shifts, outages, policy changes — without consent or control."
    signals: ["API dependency", "vendor lock-in", "model deprecation", "single point of failure", "version pinning AI"]

