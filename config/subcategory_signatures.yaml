# Compact retrieval signatures per subcategory: the one-line summary plus the
# signals that distinguish it from its neighbours. Used for query expansion.
version: '2.0'
signatures:
- name: Hallucinations
  one_line: An LLM produces plausible-sounding content that is factually wrong, fabricated, or unsupported, in the
    absence of any adversary.
  signals:
  - hallucination
  - confabulation
  - confidently wrong
  - ungrounded output
  - RAG groundedness
- name: Fabricated citations or sources
  one_line: An LLM generates references — to papers, cases, books, statutes — that either do not exist or do not
    contain the claim being attributed to them.
  signals:
  - fake citations
  - hallucinated papers
  - fabricated case law
  - Mata v. Avianca
  - fictitious precedent
- name: Incorrect reasoning
  one_line: An LLM produces output that contains logical, causal, or inferential errors despite surface coherence.
  signals:
  - logical errors
  - chain of thought wrong
  - non-sequitur
  - fallacious reasoning
  - reasoning failures
- name: Arithmetic and logical errors
  one_line: An LLM produces incorrect results on tasks involving numerical computation, comparison, or formal logical
    operators.
  signals:
  - model can't do math
  - wrong calculations
  - arithmetic errors
  - tokenization breaks math
  - date arithmetic wrong
- name: Misunderstanding context or intent
  one_line: An LLM produces output that misreads what the user actually wanted, due to ambiguity, missing context,
    or wrong assumption about implicit intent.
  signals:
  - model misunderstood
  - wrong interpretation
  - answered different question
  - missed the context
  - intent recognition
- name: Overfitting and underfitting
  one_line: An ML model either memorizes training data without learning generalizable patterns or fails to capture
    them at all.
  signals:
  - overfitting
  - underfitting
  - high variance
  - doesn't generalize
  - bias-variance tradeoff
- name: Brittleness outside training distribution
  one_line: An ML model that performs well on training-like data fails silently on inputs outside the training distribution.
  signals:
  - out of distribution
  - OOD
  - model fails on edge cases
  - brittleness
  - calibration failure OOD
- name: Failure under adversarial inputs
  one_line: An ML model produces incorrect outputs when inputs are crafted to exploit its specific weaknesses while
    appearing normal.
  signals:
  - adversarial robustness
  - evasion attacks
  - adversarial ML
  - AML
  - robustness certification
- name: Prompt injection attacks
  one_line: Attacker-controlled text reaches an LLM's context and causes it to act against operator instructions,
    directly or indirectly through retrieved content, tool outputs, or supplied data.
  signals:
  - prompt injection
  - indirect prompt injection
  - tool calling vulnerability
  - RAG security
  - OWASP LLM01
- name: Jailbreaks
  one_line: Users bypass an LLM's safety training to elicit content the model was trained to refuse.
  signals:
  - jailbreak
  - DAN
  - safety bypass
  - refusal bypass
  - GCG attack
- name: Adversarial examples
  one_line: Inputs deliberately crafted with imperceptible or constrained perturbations that cause an ML model to
    misclassify them.
  signals:
  - adversarial examples
  - FGSM
  - PGD
  - imperceptible perturbation
  - physical adversarial
- name: Data poisoning
  one_line: Adversaries corrupt training data so the resulting model behaves incorrectly on specific inputs or conditions,
    typically through backdoors.
  signals:
  - data poisoning
  - backdoor attack
  - trojan model
  - PoisonGPT
  - BadNets
- name: Distribution shift failures
  one_line: An ML model's performance degrades after deployment when real-world data drifts away from the training
    distribution, often silently.
  signals:
  - distribution shift
  - data drift
  - concept drift
  - model needs retraining
  - covariate shift
- name: Catastrophic forgetting
  one_line: A neural network trained sequentially on new tasks loses performance on previously learned tasks, often
    abruptly.
  signals:
  - catastrophic forgetting
  - continual learning
  - negative transfer
  - alignment tax
  - fine-tuning broke the model
- name: Unexpected emergent behaviors
  one_line: Capabilities or behaviors appear in larger models that were not present at smaller scale and were not
    explicitly trained for.
  signals:
  - emergent capabilities
  - scaling surprises
  - phase transitions
  - in-context learning emergence
  - capability discontinuity
- name: Objective misspecification
  one_line: The objective formally specified to an AI fails to capture what the operator actually wants, leading
    to optimization toward technically correct but undesired outcomes.
  signals:
  - objective misspecification
  - wrong objective
  - Goodhart's law
  - proxy metric
  - reward design
- name: Reward hacking
  one_line: An RL agent achieves high reward through unintended exploits of the reward function rather than by accomplishing
    the intended task.
  signals:
  - reward hacking
  - agent gaming the reward
  - RLHF gaming
  - sycophancy
  - reward model exploitation
- name: Wireheading
  one_line: An AI agent directly modifies, short-circuits, or seizes its own reward signal rather than achieving
    the intended task.
  signals:
  - wireheading
  - reward tampering
  - self-rewarding
