    signals: ["AI literacy", "public misunderstanding AI", "AI mental models", "anthropomorphizing AI", "AI understanding survey"]

  - name: "AI hype cycles"
    one_line: "Inflated expectations followed by disillusionment cycles distort AI investment, policy, and adoption — producing misallocated resources, premature deployment, and backlash that delays beneficial applications."
