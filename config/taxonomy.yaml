      - name: "Anti-competitive AI behavior"
      - name: "AI-driven market manipulation"
      - name: "Flash crashes from AI trading"
      - name: "Fraud automation with AI"
      - name: "Synthetic identity fraud"
      - name: "Insurance and pricing discrimination by AI"
      - name: "Overreliance reducing human expertise"
