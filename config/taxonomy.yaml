# AI Risk Taxonomy
# Each category contains subcategories. Each subcategory has:
#   - name: human-readable label (also used as search seed)
#   - keywords: extra terms to OR into the search query (optional)
#   - excludes: things the LLM judge should NOT count as matching this
#       subcategory (optional). Especially useful for ambiguous names where
#       the literal term appears in unrelated fields (e.g. "Hallucinations"
#       in medical/perceptual research). Threaded into the judge prompt as
#       negative anchors. Max 10 per subcategory.
#   - target_papers: how many top papers to keep (default 3)
#
# This file is the single source of truth shared with the webapp.

version: "1.0"
default_target_papers: 3

categories:
  - id: technical_reliability
    name: "Technical & Reliability Risks"
    subcategories:
      - name: "Hallucinations"
        keywords: ["LLM hallucination", "confident false outputs"]
        excludes:
          - "medical or psychiatric hallucinations"
          - "perceptual hallucinations in neuroscience"
          - "hallucinogenic drugs"
      - name: "Fabricated citations or sources"
        keywords: ["fabricated references", "LLM citation accuracy"]
      - name: "Incorrect reasoning"
        keywords: ["LLM reasoning errors", "chain-of-thought failures"]
      - name: "Arithmetic and logical errors"
        keywords: ["LLM arithmetic", "logical reasoning benchmark"]
      - name: "Misunderstanding context or intent"
        keywords: ["intent recognition", "context misinterpretation LLM"]
      - name: "Overfitting and underfitting"
      - name: "Brittleness outside training distribution"
        keywords: ["out-of-distribution", "OOD generalization"]
      - name: "Failure under adversarial inputs"
        keywords: ["adversarial robustness"]
      - name: "Prompt injection attacks"
        keywords: ["prompt injection", "indirect prompt injection"]
      - name: "Jailbreaks"
        keywords: ["LLM jailbreak", "safety bypass"]
      - name: "Adversarial examples"
      - name: "Data poisoning"
        keywords: ["training data poisoning", "backdoor attack ML"]
        excludes:
          - "literal food or water poisoning"
          - "toxicology unrelated to ML training data"
      - name: "Distribution shift failures"
      - name: "Catastrophic forgetting"
      - name: "Unexpected emergent behaviors"
        keywords: ["emergent capabilities LLM"]
      - name: "Objective misspecification"
      - name: "Reward hacking"
      - name: "Wireheading"
        excludes:
          - "literal electrical stimulation of biological brains"
          - "neuroscience studies of reward circuitry in animals"
      - name: "Proxy gaming"
      - name: "Goal misgeneralization"
      - name: "Instrumental convergence"
      - name: "Deceptive alignment"
      - name: "Inner misalignment"
        keywords: ["mesa-optimization", "inner alignment"]
      - name: "Specification gaming"
      - name: "Unpredictable outputs"
        keywords: ["LLM output variability"]
      - name: "Non-determinism in LLMs"
      - name: "Cascading system failures"
        keywords: ["multi-agent cascade failure"]
      - name: "Automation complacency"
      - name: "Silent degradation over time"
        keywords: ["model drift", "performance degradation"]
      - name: "Poor monitoring or observability"
        keywords: ["ML observability", "LLM monitoring"]
      - name: "Dependency on external APIs and models"

  - id: safety
    name: "Safety Risks"
    subcategories:
      - name: "Autonomous vehicle accidents"
        keywords: ["self-driving safety", "AV crash"]
      - name: "Industrial robot malfunctions"
      - name: "Medical diagnosis and treatment errors"
        keywords: ["clinical AI errors", "medical AI safety"]
      - name: "Unsafe autonomous weapons"
        keywords: ["lethal autonomous weapons", "LAWS"]
      - name: "Drone misuse"
        excludes:
          - "wildlife monitoring drones"
          - "agricultural drones"
          - "papers about bees or insects"
      - name: "Critical infrastructure failures"
        keywords: ["AI critical infrastructure risk"]
      - name: "Psychological manipulation by AI"
      - name: "Dangerous advice generation"
      - name: "Self-harm encouragement"
        keywords: ["LLM mental health risk"]
      - name: "Unsafe healthcare recommendations"
      - name: "Chemical and biological hazard assistance"
        keywords: ["dual-use AI biosecurity", "CBRN AI risk"]
      - name: "Child safety risks from AI"
      - name: "Legal decision errors"
        keywords: ["AI legal reasoning errors"]
      - name: "Incorrect financial decisions"
      - name: "Air traffic and power grid AI failures"
      - name: "Military escalation risks from AI"
      - name: "Disaster response mistakes"

  - id: security_cyber
    name: "Security & Cyber Risks"
    subcategories:
      - name: "Automated phishing by AI"
      - name: "Malware generation by LLMs"
        keywords: ["LLM malware", "AI-generated malware"]
      - name: "Social engineering at scale"
      - name: "Credential theft assistance"
      - name: "Vulnerability discovery and exploitation by AI"
        keywords: ["LLM vulnerability discovery", "AI exploit generation"]
      - name: "Deepfake impersonation"
      - name: "AI systems being hacked"
        keywords: ["attacks on ML models"]
      - name: "Model theft"
        keywords: ["model extraction attack"]
      - name: "API abuse of AI services"
      - name: "Supply-chain attacks on AI"
      - name: "Compromised training pipelines"
      - name: "Leakage of confidential data by LLMs"
        keywords: ["LLM data leakage"]
      - name: "Memorized training data exposure"
        keywords: ["training data extraction", "membership inference"]
      - name: "Insider threats with AI"
      - name: "Prompt leakage"
        keywords: ["system prompt extraction"]
      - name: "Sensitive document extraction"
      - name: "Self-propagating AI attacks"
      - name: "Autonomous cyberwarfare agents"
      - name: "AI-driven botnets"
      - name: "Automated disinformation networks"

  - id: privacy
    name: "Privacy Risks"
    subcategories:
      - name: "Mass surveillance with AI"
      - name: "Biometric tracking"
      - name: "Facial recognition misuse"
      - name: "Voiceprint misuse"
      - name: "Behavioral profiling"
      - name: "Re-identification attacks"
        keywords: ["de-anonymization"]
      - name: "Training on private data without consent"
      - name: "Data retention abuse"
      - name: "Sensitive inference from innocuous data"
      - name: "Loss of anonymity"
      - name: "Persistent tracking ecosystems"
      - name: "Workplace surveillance with AI"
      - name: "Government overreach via AI"

  - id: ethical
    name: "Ethical Risks"
    subcategories:
      - name: "Racial bias in AI"
      - name: "Gender bias in AI"
      - name: "Religious bias in AI"
      - name: "Political bias in LLMs"
      - name: "Socioeconomic discrimination by AI"
      - name: "Language and cultural bias in AI"
      - name: "Lack of accountability in AI systems"
      - name: "Opaque AI decision-making"
        keywords: ["explainability", "XAI"]
      - name: "Unfair automated decisions"
        keywords: ["algorithmic fairness"]
      - name: "Manipulation of vulnerable groups by AI"
      - name: "Human dignity concerns with AI"
      - name: "Exploitation of labor for training data"
        keywords: ["data labeling labor", "RLHF workers"]
      - name: "Unauthorized use of copyrighted works in training"
      - name: "Style imitation without permission"
      - name: "Deepfake pornography"
        keywords: ["non-consensual intimate imagery", "NCII deepfake"]
      - name: "Identity cloning"
      - name: "Lack of informed consent in AI data use"

  - id: social_cultural
    name: "Social & Cultural Risks"
    subcategories:
      - name: "Misinformation amplified by AI"
      - name: "Disinformation generated by AI"
      - name: "Fake news generation"
      - name: "Synthetic propaganda"
      - name: "Astroturfing with AI"
      - name: "Fake reviews and comments"
      - name: "Reality apathy"
        keywords: ["liars dividend", "trust erosion deepfakes"]
      - name: "Inability to trust media"
      - name: "Deepfake confusion"
      - name: "Collapse of evidence credibility"
      - name: "Personalized persuasion by AI"
      - name: "Political microtargeting"
      - name: "Radicalization via AI"
      - name: "Cult formation assistance"
        excludes:
          - "historical religious studies"
          - "anthropology of pre-AI cults"
      - name: "Emotional dependency on AI"
        keywords: ["AI companion dependency"]
      - name: "Homogenization of culture by AI"
