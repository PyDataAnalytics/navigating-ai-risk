      - name: "Weak oversight of AI"
      - name: "Inadequate AI safety standards"
      - name: "Lack of international AI coordination"
      - name: "Population surveillance by authoritarian AI"
      - name: "Automated censorship"
      - name: "Predictive policing abuse"
      - name: "Social credit systems"
      - name: "AI arms race"
      - name: "Strategic instability from AI"
      - name: "Unequal national AI capabilities"
      - name: "Escalation due to autonomous systems"
      - name: "Voter manipulation by AI"
      - name: "Deepfake candidates"
