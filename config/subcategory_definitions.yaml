# AI Risk Taxonomy — Subcategory Definitions (v2.2)
# =====================================================
# Expert-revised v2 with: nature, confidence, applies_when, does_not_apply_when,
# user_signals, adjacent_to (typed: similar / related), disambiguation
# (per-sibling tie-break text), and elements (6 populations).
#
# adjacent_to.similar:  close concepts the matcher might consider switching to
# adjacent_to.related:  connected but distinct concepts the matcher might mention
# disambiguation:       per-sibling line: "pick THIS when X, pick SIBLING when Y"
#                       keys must equal adjacent_to.similar exactly
#
# Names match taxonomy.yaml exactly — this is the interface contract.
#
# Version: 2.2

version: "2.2"

subcategories:

  # ════════════════════════════════════════════════════════════════════
  # Technical & Reliability Risks
  # ════════════════════════════════════════════════════════════════════

  - name: "Hallucinations"
    nature: operational
    confidence: high
    one_line: "An LLM produces plausible-sounding content that is factually wrong, fabricated, or unsupported, in the absence of any adversary."
    applies_when:
      - "Any LLM deployment where output is presented as or will be treated as factual"
      - "RAG systems where the model can override or contradict retrieved evidence (intrinsic vs extrinsic hallucination)"
      - "Summarization, QA, or information-extraction tasks where invented detail is harder to detect than refusal"
      - "Long-output generation where confabulation rate compounds (multi-paragraph answers, code, lists of items)"
      - "Use in domains where the cost of confident error is high: medicine, law, finance, journalism, research, safety-critical workflows"
    does_not_apply_when:
      - "Wrong outputs result from adversarial input (that's Prompt injection or Failure under adversarial inputs)"
      - "Outputs are creative content with no implicit factual claim (fiction, art, brainstorming where invention is the point)"
      - "The specific failure is fabricated references (that's Fabricated citations or sources — narrower and high-impact)"
      - "Errors are in reasoning steps rather than asserted facts (that's Incorrect reasoning)"
      - "The model correctly declines or hedges — uncertainty is not hallucination"
    user_signals:
      - "hallucination"
      - "confabulation"
      - "model makes things up"
      - "confidently wrong"
      - "ungrounded output"
      - "factuality"
      - "intrinsic hallucination"
      - "extrinsic hallucination"
      - "users will trust the output"
      - "we're using LLM for research"
      - "summarization accuracy"
      - "RAG groundedness"
    adjacent_to:
      similar:
        - "Fabricated citations or sources"
        - "Incorrect reasoning"
        - "Misunderstanding context or intent"
        - "Unpredictable outputs"
        - "Arithmetic and logical errors"
      related:
        - "Silent degradation over time"
        - "Overestimating AI capabilities"
    disambiguation:
      "Fabricated citations or sources": "Hallucinations for fabricated facts in general output; Fabricated citations for the specific case of invented papers, cases, or URLs."
      "Incorrect reasoning": "Hallucinations when the asserted facts are wrong; Incorrect reasoning when the facts are right but the logic connecting them is broken."
      "Misunderstanding context or intent": "Hallucinations when output is factually false; Misunderstanding when output is factually fine but answers the wrong question."
      "Unpredictable outputs": "Hallucinations for outputs being factually wrong; Unpredictable outputs for output variability across runs."
      "Arithmetic and logical errors": "Hallucinations when factual claims are made up; Arithmetic and logical errors when computations or formal operators fail."
    elements:
      threat:
        population: light
        notes: "Not adversary-driven, but failure-mode catalogues exist (HELM, TruthfulQA categories)"
      event:
        population: heavy
        notes: "Mata v. Avianca; Air Canada chatbot liability; documented medical advice failures; Stanford HAI legal AI study showing 17-33% hallucination rate even in legal-tuned models"
      operational_artifacts:
        population: heavy
        notes: "Benchmarks: TruthfulQA, HaluEval, FACTOR, FActScore, SimpleQA, HalluLens; eval frameworks like Ragas for RAG; model cards reporting factuality scores"
      mitigations_controls:
        population: heavy
        notes: "RAG with strict grounding constraints, citation-required output, retrieval verification, self-consistency checks, uncertainty quantification (semantic entropy), abstention training, constitutional methods, output validators (e.g., NeMo Guardrails)"
      regulatory_standards:
        population: moderate
        notes: "EU AI Act Article 15 accuracy obligations; FDA SaMD precision/recall requirements; bar association guidance (e.g., ABA Formal Opinion 512); financial sector model risk management"
      research:
        population: heavy
        notes: "Foundational: Ji et al. survey; Maynez et al. faithfulness work. Active areas: semantic entropy (Farquhar et al.), retrieval grounding, model-internal uncertainty, hallucination detection at inference"

  - name: "Fabricated citations or sources"
    nature: operational
    confidence: high
    one_line: "An LLM generates references — to papers, cases, books, statutes — that either do not exist or do not contain the claim being attributed to them."
    applies_when:
      - "Outputs include citations to academic papers, legal cases, statutes, or books that users will treat as verifiable"
      - "Use in academic writing, legal briefs, journalism, regulatory submissions, or research"
      - "Format encourages or mandates citations (footnotes, bibliographies, case citations)"
      - "Output volume makes manual verification of every citation impractical"
      - "Particularly acute risk: legal contexts (case citations have very specific formats LLMs can mimic without grounding)"
    does_not_apply_when:
      - "The fabrication is general factual error without a citation framing (Hallucinations)"
      - "Citations exist but their content is misrepresented (still Hallucinations, but specifically about claim attribution)"
      - "Fabricated experimental data or figures in scientific work (Fabricated experimental results from AI — narrower)"
      - "Plagiarism using real citations (Automated plagiarism, different mechanism)"
    user_signals:
      - "fake citations"
      - "made-up references"
      - "hallucinated papers"
      - "fabricated case law"
      - "ChatGPT cited paper that doesn't exist"
      - "fake DOIs"
      - "fictitious legal precedent"
      - "Mata v. Avianca"
      - "phantom citations"
      - "non-existent sources"
    adjacent_to:
      similar:
        - "Hallucinations"
        - "Automated plagiarism"
        - "Fake scientific papers by AI"
        - "Academic dishonesty with AI"
      related:
        - "Legal decision errors"
    disambiguation:
      "Hallucinations": "Fabricated citations for invented references, papers, or URLs specifically; Hallucinations for invented facts in the body of the output."
      "Automated plagiarism": "Fabricated citations when sources are made up; Automated plagiarism when real sources are copied without attribution."
      "Fake scientific papers by AI": "Fabricated citations when an LLM cites nonexistent papers in user output; Fake scientific papers when AI produces fraudulent published research."
      "Academic dishonesty with AI": "Fabricated citations for the LLM-side fabrication mechanism; Academic dishonesty for the student-side use of AI to cheat."
    elements:
      threat:
        population: light
      event:
        population: heavy
        notes: "Mata v. Avianca (2023) — paradigm case; Zachariah Crabill (Colorado); Park v. Kim (NY); Cohen filing with fabricated cases; ongoing documented sanctions of attorneys; multiple academic retractions for AI-generated citations"
      operational_artifacts:
        population: moderate
        notes: "Citation verification tools, DOI resolvers integrated into output validators, retrieval-augmented citation enforcement, structured citation schemas (JSON-mode forcing real lookup)"
      mitigations_controls:
        population: moderate
        notes: "Mandatory retrieval before citation (no citation without document in context), DOI/case-number verification at inference, post-generation citation auditing, structured output forcing source URLs, professional verification workflows"
      regulatory_standards:
        population: moderate
        notes: "ABA Formal Opinion 512; state bar AI guidance (NY, CA, FL specific orders); federal court standing orders requiring AI use disclosure; academic integrity policies; COPE guidelines on AI in publishing"
      research:
        population: moderate
        notes: "Stanford HAI legal AI study (2024); Magesh et al. on legal AI hallucination rates; ongoing work on retrieval-grounded citation"

  - name: "Incorrect reasoning"
    nature: operational
    confidence: high
    one_line: "An LLM produces output that contains logical, causal, or inferential errors despite surface coherence — the conclusion doesn't follow from the premises, or the steps don't connect correctly."
    applies_when:
      - "Tasks requiring multi-step deduction, inference, or causal analysis"
      - "Outputs where reasoning is exposed (chain-of-thought, explanations, justifications)"
      - "Decision-support contexts where users may follow the reasoning rather than verify the conclusion"
      - "Domains where surface-plausible reasoning is hard for non-experts to evaluate (law, medicine, science)"
      - "Long reasoning chains where small errors compound (agentic planning, multi-hop QA)"
    does_not_apply_when:
      - "The error is in factual recall, not reasoning steps (Hallucinations)"
      - "The error is specifically in arithmetic or formal logic (Arithmetic and logical errors — narrower, often tool-solvable)"
      - "Reasoning is internally valid but starts from wrong premises (Misunderstanding context or intent)"
      - "The reasoning is correct but the user disagrees with conclusions (not a defect)"
    user_signals:
      - "logical errors"
      - "model reasons incorrectly"
      - "chain of thought wrong"
      - "non-sequitur reasoning"
      - "doesn't follow"
      - "fallacious reasoning"
      - "model jumps to conclusions"
      - "reasoning failures"
      - "post-hoc rationalization"
    adjacent_to:
      similar:
        - "Arithmetic and logical errors"
        - "Hallucinations"
        - "Misunderstanding context or intent"
        - "Cascading system failures"
        - "Deceptive alignment"
      related: []
    disambiguation:
      "Arithmetic and logical errors": "Incorrect reasoning for inferential or causal errors broadly; Arithmetic and logical errors when failure is specifically in numerical or formal-logic operators."
      "Hallucinations": "Incorrect reasoning when premises are correct but conclusion doesn't follow; Hallucinations when one of the premises is itself fabricated."
      "Misunderstanding context or intent": "Incorrect reasoning when the LLM addresses the right question with broken logic; Misunderstanding when the LLM applies fine logic to the wrong question."
      "Cascading system failures": "Incorrect reasoning for a single model's faulty logic; Cascading failures when a reasoning error propagates through multiple downstream AI components."
      "Deceptive alignment": "Incorrect reasoning when the model is honestly mistaken; Deceptive alignment when the model produces wrong output strategically to avoid oversight."
    elements:
      threat:
        population: empty
      event:
        population: light
        notes: "Difficult to isolate from broader error categories in production; mostly visible in benchmarks"
      operational_artifacts:
        population: heavy
        notes: "Reasoning benchmarks: GSM8K, MATH, BIG-Bench Hard, ARC-AGI, HotpotQA, DROP, MuSR, GPQA; reasoning-tuned models (o1, o3, Claude with extended thinking, DeepSeek R1)"
      mitigations_controls:
        population: heavy
        notes: "Self-consistency (Wang et al.), tree-of-thought, reasoning-tuned models, verifier models, decomposition prompting, structured reasoning formats, tool use for verifiable steps"
      regulatory_standards:
        population: light
      research:
        population: heavy
        notes: "Very active: process supervision (Lightman et al.), reasoning RL (o1, DeepSeek), self-correction limits (Huang et al.), reasoning faithfulness (Lanham et al. on CoT not reflecting actual reasoning)"

  - name: "Arithmetic and logical errors"
    nature: operational
    confidence: high
    one_line: "An LLM produces incorrect results on tasks involving numerical computation, comparison, or formal logical operators."
    applies_when:
      - "Quantitative tasks performed without tool augmentation (no calculator, no code interpreter)"
      - "Financial calculations, scientific computations, statistical reasoning in outputs users will rely on"
      - "Multi-digit arithmetic, percentage calculations, unit conversions"
      - "Logical operations: implications, negations, set membership, quantifier scope"
      - "Date and time arithmetic (notoriously error-prone in LLMs)"
    does_not_apply_when:
      - "The model uses tools (calculator, Python interpreter) — different failure mode (tool misuse or wrong tool selection)"
      - "The error is in broader reasoning, not the arithmetic step itself (Incorrect reasoning)"
      - "Errors in formal proofs requiring deep mathematical reasoning vs basic arithmetic (Incorrect reasoning more apt)"
    user_signals:
      - "model can't do math"
      - "arithmetic errors"
      - "wrong calculations"
      - "LLM bad at numbers"
      - "off by one"
      - "wrong sum"
      - "tokenization breaks math"
      - "comparison errors"
      - "date arithmetic wrong"
    adjacent_to:
      similar:
        - "Incorrect reasoning"
        - "Hallucinations"
        - "Brittleness outside training distribution"
      related: []
    disambiguation:
      "Incorrect reasoning": "Arithmetic and logical errors for numerical computation or formal-logic mistakes; Incorrect reasoning for broader inferential or causal errors."
      "Hallucinations": "Arithmetic and logical errors when computations or formal operators fail; Hallucinations when factual claims are made up."
      "Brittleness outside training distribution": "Arithmetic and logical errors for the symbolic-operator failure mode; Brittleness when an ML model fails on inputs outside its training distribution."
    elements:
      threat:
        population: empty
      event:
        population: light
        notes: "Documented in safety-critical contexts (medication dosing, financial calculations) but usually caught as part of broader QA"
      operational_artifacts:
        population: heavy
        notes: "Benchmarks: GSM8K (school math), MATH (competition math), MGSM (multilingual), MathBench, AIME, FrontierMath; tool-use benchmarks (BFCL, ToolBench); specialty math models (Minerva, Llemma, DeepSeekMath)"
      mitigations_controls:
        population: heavy
        notes: "Tool use (Python, calculator) is the canonical fix — well-established pattern; chain-of-thought; self-verification; structured numerical output validation; specialized math-tuned models for high-stakes contexts"
      regulatory_standards:
        population: light
        notes: "Sector-specific accuracy requirements (FDA on medical AI calculations, financial regulators on model arithmetic)"
      research:
        population: heavy
        notes: "Foundational tokenization issues (Liu et al. on numerical tokenization); chain-of-thought (Wei et al.); program-aided LMs (Gao et al.); active work on neurosymbolic approaches and verifier models"

  - name: "Misunderstanding context or intent"
    nature: operational
    confidence: medium
    one_line: "An LLM produces output that misreads what the user actually wanted, due to ambiguity resolution, missing context, or wrong assumption about implicit intent."
    applies_when:
      - "User queries contain ambiguity that requires interpretation (which 'Apple'? which 'Paris'?)"
      - "Implicit context the model must infer (user expertise level, domain, regional conventions)"
      - "Multi-turn conversations where prior turns establish context the model may lose or misuse"
      - "Tasks where the same surface request could mean different things (\"summarize this\" → for whom, what length, what emphasis)"
      - "Agentic systems where the model must infer goals from underspecified instructions"
    does_not_apply_when:
      - "The model correctly understood but produced factually wrong content (Hallucinations)"
      - "The user's intent was hostile and the model was manipulated (Prompt injection attacks)"
      - "Cultural or linguistic misinterpretation specifically (Language and cultural bias in AI)"
      - "The model couldn't parse the input at all (different failure — usually visible as refusal or non-response)"
    user_signals:
      - "model misunderstood"
      - "wrong interpretation"
      - "answered different question"
      - "missed the context"
      - "didn't get what I meant"
      - "intent recognition"
      - "ambiguity resolution"
      - "specification gap"
      - "model assumed wrong thing"
    adjacent_to:
      similar:
        - "Hallucinations"
        - "Incorrect reasoning"
        - "Specification gaming"
        - "Goal misgeneralization"
        - "Objective misspecification"
      related: []
    disambiguation:
      "Hallucinations": "Misunderstanding when the LLM answers the wrong question correctly; Hallucinations when the LLM answers any question with invented facts."
      "Incorrect reasoning": "Misunderstanding when the LLM misreads what was asked; Incorrect reasoning when the LLM reads the request correctly but reasons badly from it."
      "Specification gaming": "Misunderstanding when the model accidentally misreads intent; Specification gaming when the model deliberately exploits a literal-but-wrong reading."
      "Goal misgeneralization": "Misunderstanding for one-shot prompt-level intent failures; Goal misgeneralization for systematic divergence between trained goal and deployment intent."
      "Objective misspecification": "Misunderstanding for run-time intent confusion; Objective misspecification when the original training objective itself didn't capture operator intent."
    elements:
      threat:
        population: empty
      event:
        population: light
      operational_artifacts:
        population: moderate
        notes: "Intent classification benchmarks; multi-turn evaluation suites (MT-Bench); ambiguity resolution datasets (AmbigQA, ClariQ)"
      mitigations_controls:
        population: moderate
        notes: "Clarification prompting (model asks before answering ambiguous queries); structured intent slots; instruction-following RLHF; context window management; explicit instruction-grounding"
      regulatory_standards:
        population: empty
      research:
        population: moderate
        notes: "Active in pragmatics-aware LMs; underspecified task research; clarification-question generation; theory of mind in LLMs"

  - name: "Overfitting and underfitting"
    nature: operational
    confidence: high
    one_line: "An ML model either memorizes training data without learning generalizable patterns (overfitting) or fails to capture them at all (underfitting), producing poor performance on new data."
    applies_when:
      - "Training or fine-tuning custom ML models (not prompting pre-trained LLMs)"
      - "Significant train-vs-validation performance gap (overfitting) or both poor (underfitting)"
      - "Architecture, regularization, hyperparameter, or training-duration decisions in progress"
      - "Production model whose accuracy doesn't match offline evaluation"
      - "Small datasets where overfitting risk is acute"
    does_not_apply_when:
      - "Using pretrained foundation models via API without fine-tuning (different failure modes)"
      - "Performance degradation after deployment as data shifts (Distribution shift failures)"
      - "Catastrophic forgetting from sequential training (Catastrophic forgetting)"
      - "Generalization failure on adversarial inputs (Failure under adversarial inputs)"
    user_signals:
      - "overfitting"
      - "underfitting"
      - "high variance"
      - "high bias"
      - "training accuracy high test accuracy low"
      - "model doesn't generalize"
      - "memorized training set"
      - "bias-variance tradeoff"
      - "regularization"
    adjacent_to:
      similar:
        - "Brittleness outside training distribution"
        - "Distribution shift failures"
        - "Catastrophic forgetting"
      related:
        - "Memorized training data exposure"
    disambiguation:
      "Brittleness outside training distribution": "Overfitting/underfitting for failure modes diagnosed during training; Brittleness for the deployment-time symptom of failing on out-of-distribution inputs."
      "Distribution shift failures": "Overfitting/underfitting when the training process itself was flawed; Distribution shift when training was fine but the deployed data has drifted from it."
      "Catastrophic forgetting": "Overfitting/underfitting for single-task generalization failures; Catastrophic forgetting when sequential training on new tasks erases previously learned ones."
    elements:
      threat:
        population: empty
      event:
        population: empty
      operational_artifacts:
        population: moderate
        notes: "Standard ML frameworks (scikit-learn, PyTorch, TF) with built-in regularization; hyperparameter tuning tools (Optuna, Ray Tune, Weights & Biases sweeps); cross-validation libraries"
      mitigations_controls:
        population: heavy
        notes: "L1/L2 regularization, dropout, batch normalization, data augmentation, early stopping, cross-validation, ensembling, learning rate schedules, weight decay — well-established practice"
      regulatory_standards:
        population: light
        notes: "Sector-specific model validation requirements (SR-11-7 for banking, FDA for medical devices)"
      research:
        population: heavy
        notes: "Foundational ML theory; ongoing work on double descent, overparameterization (Belkin et al.), grokking, scaling laws"

  - name: "Brittleness outside training distribution"
    nature: operational
    confidence: high
    one_line: "An ML model that performs well on data similar to training fails unpredictably and silently on inputs that lie outside the training distribution."
    applies_when:
      - "Models deployed in environments where input distribution may differ from training (production drift, demographic differences, new contexts)"
      - "Edge cases, rare inputs, or novel scenarios are foreseeable"
      - "Performance degradation may be invisible without OOD detection"
      - "Safety-critical applications: medical imaging on different populations, autonomous systems in new geographies, vision models in new lighting"
      - "Models where overconfidence on OOD inputs is particularly dangerous (calibration failure)"
    does_not_apply_when:
      - "Initial training-time fitting issues (Overfitting and underfitting)"
      - "Distribution drift over time post-deployment (Distribution shift failures — temporal, related but distinct)"
      - "Adversaries deliberately crafting OOD inputs (Adversarial examples — adversarial, narrower)"
      - "Model performs poorly on training distribution too (broader training failure)"
    user_signals:
      - "out of distribution"
      - "OOD"
      - "model fails on edge cases"
      - "doesn't handle new data"
      - "brittleness"
      - "domain shift"
      - "calibration failure OOD"
      - "selective prediction"
      - "open-world performance"
    adjacent_to:
      similar:
        - "Distribution shift failures"
        - "Overfitting and underfitting"
        - "Adversarial examples"
        - "Failure under adversarial inputs"
        - "Arithmetic and logical errors"
      related:
        - "Medical diagnosis and treatment errors"
        - "Autonomous vehicle accidents"
    disambiguation:
      "Distribution shift failures": "Brittleness for failure on any input outside training distribution; Distribution shift specifically for gradual drift of the real-world data distribution over time."
      "Overfitting and underfitting": "Brittleness for the deployment symptom on OOD inputs; Overfitting/underfitting for the underlying training-process cause."
      "Adversarial examples": "Brittleness for natural OOD inputs that fail unintentionally; Adversarial examples for inputs deliberately crafted to fail."
      "Failure under adversarial inputs": "Brittleness for unintentional failures on natural OOD inputs; Failure under adversarial inputs for failures on attacker-crafted inputs."
      "Arithmetic and logical errors": "Brittleness when an ML model fails on inputs outside its training distribution; Arithmetic and logical errors for the symbolic-operator failure mode."
    elements:
      threat:
        population: light
      event:
        population: heavy
        notes: "Autonomous vehicle edge-case crashes; medical AI failing on demographically different populations (Obermeyer et al.); ImageNet models failing on natural distribution shifts (ImageNet-A, -R, -C); Epic sepsis model real-world failures"
      operational_artifacts:
        population: heavy
        notes: "OOD detection libraries (PyTorch-OOD, OpenOOD); robustness benchmarks (ImageNet-C/A/R, WILDS, DomainBed); calibration tools (Netcal, conformal prediction libraries)"
      mitigations_controls:
        population: heavy
        notes: "OOD detection (energy-based, Mahalanobis distance, max-softmax baselines), calibration (temperature scaling, isotonic regression), conformal prediction for guaranteed coverage, ensembles, domain adaptation, abstention/selective prediction, deployment monitoring"
      regulatory_standards:
        population: moderate
        notes: "EU AI Act Article 15 robustness requirements; FDA AI/ML guidance on generalization across patient populations; ISO 21448 (SOTIF) for automotive; ISO/IEC TR 24029 on robustness"
      research:
        population: heavy
        notes: "Foundational: Hendrycks et al. on benchmarks; Salehi et al. survey; active areas in conformal prediction (Vovk, Angelopoulos), distributionally robust optimization, foundation model OOD properties"

  - name: "Failure under adversarial inputs"
    nature: operational
    confidence: high
    one_line: "An ML model produces incorrect outputs when inputs are crafted to exploit its specific weaknesses, even when those crafted inputs look normal to humans."
    applies_when:
      - "ML systems processing inputs from any untrusted source"
      - "Security-relevant contexts: authentication (face/voice ID), content moderation, malware detection, fraud detection, autonomous safety"
      - "Adversarial robustness has not been explicitly evaluated and addressed"
      - "Models with API exposure that adversaries can query repeatedly"
      - "Both white-box (model known) and black-box (query-only) attack settings"
    does_not_apply_when:
      - "The attack is via natural-language instruction injection (Prompt injection attacks — specific to LLMs)"
      - "Inputs are non-adversarial OOD (Brittleness outside training distribution)"
      - "Specifically about imperceptible perturbations to specific inputs (Adversarial examples — narrower)"
      - "Model is being extracted, not fooled (Model theft)"
    user_signals:
      - "adversarial robustness"
      - "evasion attacks"
      - "model fooled"
      - "adversarial ML"
      - "AML"
      - "robustness certification"
      - "black-box attack"
      - "transfer attack"
      - "physical adversarial"
    adjacent_to:
      similar:
        - "Adversarial examples"
        - "Prompt injection attacks"
        - "Brittleness outside training distribution"
        - "Jailbreaks"
      related:
        - "AI systems being hacked"
    disambiguation:
      "Adversarial examples": "Failure under adversarial inputs as the general failure category; Adversarial examples specifically for imperceptibly-perturbed inputs that fool classifiers."
      "Prompt injection attacks": "Failure under adversarial inputs for classical ML attack inputs; Prompt injection for LLM-specific attacks via text in context, retrieval, or tool output."
      "Brittleness outside training distribution": "Failure under adversarial inputs for attacker-crafted inputs; Brittleness for unintentional failures on natural OOD inputs."
      "Jailbreaks": "Failure under adversarial inputs for inputs that produce wrong outputs; Jailbreaks for inputs that bypass safety training to elicit refused content."
    elements:
      threat:
        population: heavy
        notes: "ATLAS AML.T0015 (Evade ML Model); NIST AI 100-2 attack taxonomy (evasion, poisoning, privacy, abuse); ATT&CK adjacent techniques for AI-targeting"
      event:
        population: moderate
        notes: "Face recognition adversarial attacks (Sharif et al. eyeglass frames); road sign physical perturbations (Eykholt et al.); malware classifier evasion in production; voice authentication bypass; documented evasion of content moderation classifiers"
      operational_artifacts:
        population: heavy
        notes: "Toolboxes: ART (Adversarial Robustness Toolbox by IBM/Linux Foundation), Foolbox, CleverHans, AutoAttack; robustness benchmarks: RobustBench, AdvBench; certified-defense models"
      mitigations_controls:
        population: heavy
        notes: "Adversarial training (Madry et al., TRADES), certified defenses (randomized smoothing — Cohen et al.), input preprocessing (JPEG compression, total variation), detection-based defenses, ensembling, query rate limiting for API-based defenses"
      regulatory_standards:
        population: moderate
        notes: "EU AI Act Article 15 (robustness and cybersecurity); NIST AI 100-2 (2024) adversarial ML taxonomy; ISO/IEC 27090 (emerging)"
      research:
        population: heavy
        notes: "Foundational: Goodfellow et al. (FGSM); Madry et al. (PGD); Carlini & Wagner; ongoing work on certified robustness, attacks on foundation models, transferability"

  - name: "Prompt injection attacks"
    nature: operational
    confidence: high
    one_line: "Attacker-controlled text reaches an LLM's context and causes it to act against the operator's instructions, by either overriding system prompts directly or arriving indirectly through retrieved content, tool outputs, or user-supplied data."
    applies_when:
      - "Any deployment where attacker-controllable text reaches the same context as operator instructions, whether from end users, content providers, or upstream systems"
      - "Agentic systems where tool outputs are fed back into model context — tool responses are the most common indirect injection vector and are routinely under-defended because operators trust their own infrastructure"
      - "RAG over corpora that include any user-contributed, third-party, or web-scraped content; private corpora are also vulnerable when ingestion boundaries aren't strict"
      - "Multi-turn systems with persistent memory, where injection in turn N can affect behavior in turn N+10 through stored context"
      - "Any LLM with access to tools that can take actions, regardless of how 'safe' individual tools appear — composition of read-only tools can yield write capability"
      - "Browser-using agents, email-reading agents, document-processing agents — all canonical indirect injection vectors"
    does_not_apply_when:
      - "The model only processes operator-controlled, statically constructed prompts with no runtime user or document input"
      - "The threat model is the model's own faulty output absent any adversary (Hallucinations or Incorrect reasoning)"
      - "Bypass of safety training via direct user prompting with no embedded content (Jailbreaks — related but architecturally distinct: jailbreaks target alignment, injections target context boundaries)"
      - "Adversarial inputs to non-LLM models like vision classifiers (Adversarial examples — different attack surface and mitigations)"
      - "Extraction of the system prompt specifically as the goal (Prompt leakage — often a sub-goal within injection attacks)"
    user_signals:
      - "prompt injection"
      - "indirect prompt injection"
      - "tool calling vulnerability"
      - "untrusted context"
      - "RAG security"
      - "agent reads emails"
      - "agent browses the web"
      - "system prompt override"
      - "Greshake attacks"
